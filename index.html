<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>VakDab • твій аніме каталог</title>
    <link rel="preconnect" href="https://monoanime.animegran8.workers.dev" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preload" href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;400;500;600;700;800;900&display=swap" as="style" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <meta property="og:title" content="VakDab - твій аніме каталог" />
    <meta property="og:description" content="Сучасна платформа для перегляду аніме" />
    <meta property="og:type" content="website" />
    <script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.13/dist/hls.min.js"></script>
    <link rel="icon" href="favicon.ico" type="image/x-icon" />
    <meta name="theme-color" content="#0d0d0d" />

    <script type="importmap">
        {
            "imports": {
                "firebase/app": "https://www.gstatic.com/firebasejs/12.16.0/firebase-app.js",
                "firebase/auth": "https://www.gstatic.com/firebasejs/12.16.0/firebase-auth.js",
                "firebase/firestore": "https://www.gstatic.com/firebasejs/12.16.0/firebase-firestore.js"
            }
        }
    </script>

    <style>
        :root {
            --accent: #0b0b0b;
            --accent-rgb: 11, 11, 11;
            --accent-hover: #1a1a1a;
            --accent-text: #ffffff;
            --accent-gradient: linear-gradient(135deg, #0b0b0b, #1a1a1a);
            --accent-light: rgba(11, 11, 11, 0.15);
            --accent-glow: rgba(11, 11, 11, 0.35);
            --bg: #ffffff;
            --surface: rgba(255, 255, 255, 0.98);
            --text: #0b0b0b;
            --text-secondary: #4a4a4a;
            --text-muted: #7a7a7a;
            --border: #e9e9e9;
            --border-light: #f3f3f3;
            --border-hover: #d0d0d0;
            --hover: rgba(0, 0, 0, 0.03);
            --tag-bg: #f6f6f6;
            --glass: rgba(255, 255, 255, 0.6);
            --glass-dark: rgba(20, 20, 20, 0.35);
            --blur-amount: 8px;
            --shadow-sm: 0 6px 18px rgba(11, 11, 11, 0.06);
            --shadow-md: 0 14px 32px rgba(11, 11, 11, 0.10);
            --shadow-lg: 0 30px 60px rgba(11, 11, 11, 0.14);
            --radius-sm: 12px;
            --radius: 16px;
            --radius-md: 14px;
            --radius-lg: 22px;
            --radius-xl: 28px;
            --transition: 280ms cubic-bezier(.2, .9, .2, 1);
            --transition-smooth: 360ms cubic-bezier(.2, .9, .2, 1);
            --agnative-scale: 1;
            --hero-extra-width: 1.3cm;
        }

        .dark-mode {
            --accent: #f7f7f7;
            --accent-rgb: 247, 247, 247;
            --accent-hover: #cfcfcf;
            --accent-text: #0a0a0a;
            --accent-gradient: linear-gradient(135deg, #f7f7f7, #cfcfcf);
            --accent-light: rgba(247, 247, 247, 0.15);
            --accent-glow: rgba(247, 247, 247, 0.35);
            --bg: #0a0a0a;
            --surface: rgba(20, 20, 20, 0.95);
            --text: #f7f7f7;
            --text-secondary: #cfcfcf;
            --text-muted: #9a9a9a;
            --border: #222222;
            --border-light: #151515;
            --border-hover: #3a3a3a;
            --hover: rgba(255, 255, 255, 0.02);
            --tag-bg: #141414;
            --glass: rgba(255, 255, 255, 0.04);
            --glass-dark: rgba(0, 0, 0, 0.45);
            --shadow-sm: 0 6px 18px rgba(0, 0, 0, 0.4);
            --shadow-md: 0 14px 32px rgba(0, 0, 0, 0.55);
            --shadow-lg: 0 30px 60px rgba(0, 0, 0, 0.6);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        html,
        body {
            height: 100%;
            scroll-behavior: smooth;
            -webkit-text-size-adjust: 100%;
        }
        body {
            font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: var(--bg);
            color: var(--text);
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            transition: background var(--transition-smooth), color var(--transition-smooth);
            line-height: 1.5;
            overflow-x: hidden;
            font-size: 16px;
        }

        .app-container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 0 0.75rem 2rem;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            position: relative;
            overflow-x: clip;
        }
        @media (min-width:480px) {
            .app-container { padding: 0 1rem 2.5rem; }
        }
        @media (min-width:1024px) {
            .app-container { padding: 0 2rem 3rem; }
            .hero-wrapper { width: calc(100% + 4rem); margin-left: -2rem; margin-right: -2rem; }
        }

        @keyframes fadeInUp {
            from { opacity:0; transform:translateY(16px); }
            to { opacity:1; transform:translateY(0); }
        }
        @keyframes subtlePulse {
            0%,100% { transform:scale(1); }
            50% { transform:scale(1.02); }
        }
        @keyframes scaleIn {
            from { opacity:0; transform:scale(0.92); }
            to { opacity:1; transform:scale(1); }
        }
        @keyframes spin { to { transform:rotate(360deg); } }
        @keyframes skeletonShimmer {
            0% { background-position:-200px 0; }
            100% { background-position:calc(200px + 100%) 0; }
        }
        @keyframes heroFadeIn {
            from { opacity:0; transform:scale(1.04) rotate(0.5deg); }
            to { opacity:1; transform:scale(1) rotate(0); }
        }

        .header {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            gap: 0.6rem;
            padding: 0.6rem 0.8rem 0.4rem;
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            z-index: 30;
            background: transparent !important;
            border: none !important;
            box-shadow: none !important;
            backdrop-filter: none !important;
            transition: all var(--transition);
            pointer-events: none;
        }
        .header>* {
            pointer-events: auto;
        }

        @media (min-width:480px) {
            .header { padding: 0.8rem 1rem 0.5rem; gap: 0.8rem; }
        }
        @media (min-width:768px) {
            .header { padding: 1rem 1.2rem 0.6rem; gap: 1rem; }
        }
        @media (min-width:1024px) {
            .header { padding: 1.2rem 1.5rem 0.8rem; gap: 1.2rem; }
        }

        /* ===== HERO BANNER v2 — Black & White Glassmorphism ===== */
        .hero-wrapper {
            position: relative;
            width: calc(100% + 1.5rem);
            max-width: none;
            margin-left: -0.75rem;
            margin-right: -0.75rem;
            margin-top: 0;
            border-radius: 0;
            overflow: hidden;
            box-shadow: none;
            background: #0a0a0a;
            height: 100vh;
            height: 100svh;
            min-height: 500px;
        }
        @media (max-width: 768px) {
            .hero-wrapper {
                height: 100vh;
                height: 100svh;
                min-height: 400px;
                width: calc(100% + 2rem);
                margin-left: -1rem;
                margin-right: -1rem;
                margin-top: 0;
            }
        }
        @media (max-width: 480px) {
            .hero-wrapper {
                height: 100vh;
                height: 100svh;
                min-height: 360px;
                width: calc(100% + 1.5rem);
                margin-left: -0.75rem;
                margin-right: -0.75rem;
                margin-top: 0;
            }
        }
        body:not(.dark-mode) .hero-wrapper {
            background: #0a0a0a;
            margin-top: 0;
        }

        #heroSlidesContainer {
            position: absolute;
            inset: 0;
        }

        .hero-slide {
            display: none;
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }
        .hero-slide.active {
            display: block;
            animation: heroFadeIn 0.7s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* Background with grayscale → color on hover */
        .hero-slide-bg {
            position: absolute;
            inset: 0;
            background-size: cover;
            background-position: center top;
            filter: grayscale(0) contrast(1);
            transform: scale(1.08);
            transition: transform 8s ease, filter 0.6s ease;
        }
        .hero-slide.active .hero-slide-bg {
            transform: scale(1);
        }
        .hero-wrapper:hover .hero-slide-bg {
            filter: grayscale(0) contrast(1);
        }

        /* Gradient overlays — B&W glassmorphism */
        .hero-slide-overlay {
            position: absolute;
            inset: 0;
            background: linear-gradient(to top,
                rgba(10,10,10,0.95) 0%,
                rgba(10,10,10,0.7) 25%,
                rgba(10,10,10,0.3) 55%,
                rgba(10,10,10,0.1) 80%,
                transparent 100%);
            z-index: 1;
        }
        .hero-slide-overlay::after {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(105deg,
                rgba(10,10,10,0.6) 0%,
                transparent 50%);
            backdrop-filter: blur(2px);
            -webkit-backdrop-filter: blur(2px);
        }
        body:not(.dark-mode) .hero-slide-overlay {
            background: linear-gradient(to top,
                rgba(10,10,10,0.92) 0%,
                rgba(10,10,10,0.6) 25%,
                rgba(10,10,10,0.2) 55%,
                rgba(10,10,10,0.05) 80%,
                transparent 100%);
        }

        /* Content container */
        .hero-slide-content {
            position: absolute;
            inset: 0;
            bottom: auto;
            z-index: 3;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            align-items: flex-start;
            text-align: left;
            gap: clamp(10px, 1.8vh, 24px);
            padding: 90px 20px 140px;
            height: 100%;
            box-sizing: border-box;
            background: transparent;
        }

        /* Rating badge — glassmorphism */
        .hero-rating-row {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }
        .hero-rating-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: rgba(255,255,255,0.08);
            border: 1px solid rgba(255,255,255,0.15);
            color: #fff !important;
            padding: 6px 14px;
            border-radius: 50px;
            font-size: 0.85rem;
            font-weight: 700;
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            letter-spacing: 0.3px;
        }
        .hero-rating-badge .star {
            color: #fff;
            font-size: 0.8rem;
            filter: drop-shadow(0 0 4px rgba(255,255,255,0.3));
        }
        .hero-meta {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(255,255,255,0.06);
            border: 1px solid rgba(255,255,255,0.10);
            color: rgba(255,255,255,0.8) !important;
            padding: 6px 14px;
            border-radius: 50px;
            font-size: 0.78rem;
            font-weight: 500;
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            letter-spacing: 0.3px;
        }
        .hero-meta-dot {
            width: 3px;
            height: 3px;
            border-radius: 50%;
            background: rgba(255,255,255,0.4);
            display: inline-block;
        }

        /* Title */
        .hero-slide-title {
            font-size: clamp(1.5rem, 4.5vw, 3.5rem);
            font-weight: 800;
            color: #ffffff !important;
            line-height: 1.15;
            text-align: left;
            text-shadow: 0 2px 30px rgba(0,0,0,0.8);
            max-width: 80%;
            letter-spacing: -0.5px;
        }
        @media (max-width: 480px) {
            .hero-slide-title {
                font-size: 1.5rem;
                max-width: 92%;
            }
        }

        /* Synopsis */
        .hero-slide-desc {
            color: rgba(255,255,255,0.75) !important;
            font-size: clamp(0.85rem, 1.2vw, 1rem);
            line-height: 1.6;
            max-width: 55%;
            text-align: left;
            text-shadow: 0 1px 8px rgba(0,0,0,0.5);
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
            margin: 0;
        }
        @media (max-width: 768px) {
            .hero-slide-desc {
                max-width: 85%;
                -webkit-line-clamp: 2;
            }
        }
        @media (max-width: 480px) {
            .hero-slide-desc {
                max-width: 92%;
                font-size: 0.82rem;
                -webkit-line-clamp: 2;
            }
        }

        /* Tags */
        .hero-slide-tags {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            text-align: left;
        }
        .hero-tag {
            background: rgba(255,255,255,0.08);
            border: 1px solid rgba(255,255,255,0.15);
            color: rgba(255,255,255,0.92) !important;
            padding: 5px 16px;
            border-radius: 50px;
            font-size: 0.75rem;
            font-weight: 500;
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            text-shadow: 0 1px 6px rgba(0,0,0,0.3);
            letter-spacing: 0.3px;
            transition: all 0.25s ease;
        }
        .hero-tag.genre-tag {
            background: rgba(255,255,255,0.06);
            border-color: rgba(255,255,255,0.12);
            color: rgba(255,255,255,0.82) !important;
        }
        .hero-tag:hover {
            background: rgba(255,255,255,0.18);
            border-color: rgba(255,255,255,0.25);
            transform: translateY(-1px);
        }

        /* Button — glassmorphism */
        .hero-slide-btn-row {
            display: flex;
            align-items: center;
            gap: 1rem;
            flex-wrap: wrap;
        }
        @media (max-width: 480px) {
            .hero-slide-btn-row {
                flex-direction: column;
                align-items: flex-start;
                gap: 0.7rem;
            }
        }
        .hero-slide-btn-row .hero-rating-row {
            flex-wrap: wrap;
        }
        .hero-slide-btn {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            background: rgba(255,255,255,0.10);
            border: 1px solid rgba(255,255,255,0.18);
            color: #ffffff !important;
            padding: 14px 36px;
            border-radius: 50px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            transition: all 0.3s cubic-bezier(0.4,0,0.2,1);
            text-decoration: none;
            letter-spacing: 0.5px;
            text-shadow: 0 1px 6px rgba(0,0,0,0.2);
            box-shadow: 0 4px 24px rgba(0,0,0,0.25);
        }
        .hero-slide-btn:hover {
            background: rgba(255,255,255,0.22);
            transform: translateY(-3px) scale(1.02);
            box-shadow: 0 10px 40px rgba(0,0,0,0.4);
            border-color: rgba(255,255,255,0.30);
        }
        .hero-slide-btn:active {
            transform: translateY(-1px) scale(1);
        }
        .hero-slide-btn .btn-icon {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            background: rgba(255,255,255,0.15);
            font-size: 0.85rem;
            transition: all 0.3s ease;
        }
        .hero-slide-btn:hover .btn-icon {
            background: rgba(255,255,255,0.25);
            transform: translateX(3px);
        }
        @media (max-width: 480px) {
            .hero-slide-btn {
                padding: 12px 28px;
                font-size: 0.9rem;
            }
        }

        /* Navigation arrows — glassmorphism */
        .hero-nav {
            position: absolute;
            bottom: clamp(70px, 10vh, 130px);
            width: 46px;
            height: 46px;
            background: rgba(10,10,10,0.4);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255,255,255,0.10);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            z-index: 20;
            transition: all 0.3s cubic-bezier(0.4,0,0.2,1);
            color: rgba(255,255,255,0.7);
            font-size: 1.1rem;
            padding: 0;
            box-shadow: 0 4px 20px rgba(0,0,0,0.2);
        }
        .hero-nav:hover {
            background: rgba(255,255,255,0.15);
            transform: scale(1.12);
            color: #fff;
            border-color: rgba(255,255,255,0.25);
            box-shadow: 0 8px 32px rgba(0,0,0,0.35);
        }
        .hero-nav-prev { left: 24px; }
        .hero-nav-next { right: 24px; }

        /* Dot indicators */
        .hero-dots {
            position: absolute;
            bottom: clamp(30px, 5.5vh, 72px);
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 8px;
            z-index: 20;
            align-items: center;
        }
        .hero-dot {
            width: 24px;
            height: 3px;
            border-radius: 2px;
            background: rgba(255,255,255,0.25);
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .hero-dot.active {
            background: #ffffff;
            width: 40px;
            box-shadow: 0 0 8px rgba(255,255,255,0.3);
        }

        /* Auto-play progress bar */
        .hero-progress-bar {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 3px;
            background: rgba(255,255,255,0.08);
            z-index: 25;
        }
        .hero-progress-fill {
            height: 100%;
            width: 0%;
            background: rgba(255,255,255,0.6);
            transition: width 0.1s linear;
        }

        @media (min-width: 480px) {
            .hero-slide-content { padding: 90px 5% 140px; }
            .hero-nav { width: 46px; height: 46px; font-size: 1.1rem; }
        }
        @media (min-width: 768px) {
            .hero-slide-content { padding: 100px 6% 150px; }
            .hero-nav {
                bottom: clamp(70px, 10vh, 130px);
                width: 52px;
                height: 52px;
                font-size: 1.2rem;
            }
            .hero-nav-prev { left: 32px; }
            .hero-nav-next { right: 32px; }
        }
        @media (min-width: 1024px) {
            .hero-slide-content { padding: 100px 8% 150px; }
        }
        @media (max-width: 480px) {
            .hero-slide-content {
                padding: 80px 16px 130px;
                gap: clamp(10px, 1.5vh, 18px);
            }
            .hero-nav {
                bottom: 70px;
                width: 40px;
                height: 40px;
                font-size: 1rem;
            }
            .hero-nav-prev { left: 16px; }
            .hero-nav-next { right: 16px; }
            .hero-dots { bottom: 32px; gap: 6px; }
            .hero-dot { width: 18px; height: 2px; }
            .hero-dot.active { width: 30px; }
        }

        .dark-mode .hero-slide-content { background: transparent; }

        .anime-card {
            background: var(--surface);
            border-radius: var(--radius-sm);
            border: 1px solid var(--border);
            box-shadow: var(--shadow-sm);
            transition: transform var(--transition), box-shadow var(--transition), border-color var(--transition);
            cursor: pointer;
            overflow: hidden;
            position: relative;
            animation: fadeInUp 0.5s ease both;
            display: flex;
            flex-direction: column;
            width: 100%;
            min-height: 160px;
        }
        .anime-card:hover {
            transform: translateY(-4px);
            box-shadow: var(--shadow-md);
            border-color: var(--accent);
        }
        @media (min-width:480px) {
            .anime-card {
                border-radius: var(--radius);
                min-height: 180px;
            }
            .anime-card:hover {
                transform: translateY(-6px);
            }
        }

        .anime-poster {
            width: 100%;
            aspect-ratio: 2/3;
            background: #e0e0e0;
            border-radius: var(--radius-sm) var(--radius-sm) 0 0;
            overflow: hidden;
            flex-shrink: 0;
            position: relative;
        }
        .dark-mode .anime-poster {
            background: #2a2a2a;
        }
        .anime-poster img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.4s ease;
        }
        .anime-card:hover .anime-poster img {
            transform: scale(1.05);
        }

        .anime-title-under {
            padding: 0.4rem 0.3rem 0.35rem;
            font-weight: 700;
            font-size: 0.75rem;
            line-height: 1.2;
            color: var(--text);
            text-align: center;
            background: transparent;
            flex: 1 1 auto;
            display: flex;
            align-items: center;
            justify-content: center;
            word-break: break-word;
            min-height: 2.2em;
        }
        @media (min-width:480px) {
            .anime-title-under {
                font-size: 0.8rem;
                padding: 0.45rem 0.35rem 0.4rem;
                min-height: 2.4em;
            }
        }
        @media (min-width:768px) {
            .anime-title-under {
                font-size: 0.85rem;
                padding: 0.5rem 0.4rem 0.4rem;
                min-height: 2.6em;
            }
        }

        .grid-3cols {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 0.8rem;
            margin-top: 0.5rem;
            flex: 1;
        }
        @media (min-width:480px) {
            .grid-3cols { gap: 1rem; }
        }
        @media (min-width:1024px) {
            .grid-3cols { gap: 1.6rem; }
        }

        .anime-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 0.8rem;
            margin-top: 0.5rem;
            flex: 1;
        }
        @media (min-width:480px) {
            .anime-grid { gap: 1rem; }

        #playerPageModal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.92);
            z-index: 2000;
            justify-content: center;
            align-items: flex-start;
            padding: 0;
            overflow-y: auto;
        }
        /* ═══════════════════════════════════════════════════════
           PLAYER PAGE — новий дизайн (hero + episodes grid)
           ═══════════════════════════════════════════════════════ */
        #playerPageModal .modal-content {
            background: var(--bg);
            max-width: 100%;
            width: 100%;
            min-height: 100vh;
            border-radius: 0;
            border: none;
            box-shadow: none;
            margin: 0;
            overflow-y: visible;
            position: relative;
            padding-bottom: 0;
        }

        .player-blur-bg {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background-size: cover;
            background-position: center;
            filter: blur(40px) brightness(0.25);
            transform: scale(1.15);
            z-index: -1;
            transition: background-image 0.5s ease;
        }

        .player-page { display: none; animation: fadeInUp 0.3s ease; }
        .player-page.active { display: block; }

        /* ── HERO (Page 1: Anime Info) ── */
        .pp-hero {
            position: relative;
            height: 380px;
            isolation: isolate;
            margin-bottom: -1px;
        }
        .pp-hero-bg {
            position: absolute; inset: 0; z-index: -2;
            background-size: cover;
            background-position: center 15%;
            opacity: 0.5;
        }
        .pp-hero-bg::after {
            content: '';
            position: absolute; inset: 0; z-index: -1;
            background: linear-gradient(180deg, transparent 0%, rgba(0,0,0,0.4) 50%, var(--bg) 95%);
        }
        .pp-hero-smoke {
            position: absolute; z-index: -1; inset: 0;
            background:
                radial-gradient(220px 320px at 78% 18%, rgba(255,255,255,0.06), transparent 60%),
                radial-gradient(160px 240px at 60% 8%, rgba(255,255,255,0.04), transparent 65%);
            filter: blur(18px);
            pointer-events: none;
        }

        .pp-topbar {
            position: absolute; top: 16px; left: 16px; right: 16px;
            display: flex; justify-content: space-between; align-items: flex-start;
            z-index: 5;
        }
        .pp-icon-btn {
            width: 34px; height: 34px; border-radius: 50%;
            background: rgba(0,0,0,0.35);
            border: 1px solid var(--border);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            display: flex; align-items: center; justify-content: center;
            color: var(--text);
            cursor: pointer; flex-shrink: 0;
            transition: all 0.2s;
        }
        .pp-icon-btn:active { transform: scale(0.92); }
        .pp-icon-btn svg { width: 16px; height: 16px; }

        .pp-top-right {
            display: flex; flex-direction: column; align-items: flex-end; gap: 8px;
        }
        .pp-status-tag {
            font-size: 10px; color: var(--text-muted);
            background: rgba(0,0,0,0.35);
            border: 1px solid var(--border);
            padding: 4px 8px; border-radius: 6px;
            backdrop-filter: blur(14px);
        }
        .pp-age-badge {
            padding: 4px 10px; border-radius: 8px;
            font-size: 11px; font-weight: 700;
            background: rgba(0,0,0,0.35);
            border: 1px solid var(--border);
            color: var(--text);
            backdrop-filter: blur(14px);
        }

        .pp-kicker {
            position: absolute; left: 0; right: 0; bottom: 90px;
            text-align: center; padding: 0 16px; z-index: 5;
            font-size: 18px; font-weight: 600;
            color: var(--text);
            text-shadow: 0 2px 18px rgba(0,0,0,0.8);
        }

        .pp-content-top {
            padding: 0 16px 2px;
            text-align: center;
            position: relative; z-index: 1;
        }
        .pp-title {
            font-size: 22px; line-height: 1.2; font-weight: 700;
            color: var(--text);
            margin-bottom: 6px;
            letter-spacing: -0.5px;
        }
        .pp-meta-line {
            font-size: 13px; color: var(--text-muted);
            margin-bottom: 12px;
        }
        .pp-tag-row {
            display: flex; flex-wrap: wrap; gap: 6px;
            justify-content: center; margin-bottom: 8px;
        }
        .pp-tag {
            font-size: 11px; padding: 5px 10px;
            border-radius: 8px;
            border: 1px solid var(--border);
            background: rgba(var(--accent-rgb), 0.04);
            color: var(--text-muted);
            white-space: nowrap;
        }

        .pp-ratings-row {
            display: flex; gap: 8px; justify-content: center;
            margin: 14px 16px 8px;
        }
        .pp-rating-card {
            background: rgba(0,0,0,0.3);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 10px 18px;
            text-align: center;
            backdrop-filter: blur(14px);
        }
        .pp-rating-num { font-size: 18px; font-weight: 700; color: var(--text); }
        .pp-rating-label {
            font-size: 9px; color: var(--text-muted);
            text-transform: uppercase; letter-spacing: 0.06em;
            margin-top: 2px;
        }

        .pp-format-row {
            display: flex; gap: 6px; justify-content: center;
            margin-bottom: 14px;
        }
        .pp-format-pill {
            font-size: 10px; font-weight: 700; letter-spacing: 0.05em;
            padding: 5px 14px; border-radius: 7px;
            border: 1px solid var(--border);
            color: var(--text-muted);
            background: rgba(var(--accent-rgb), 0.04);
        }

        .pp-actions {
            display: flex; align-items: center;
            justify-content: center; gap: 36px;
            padding: 0 16px 10px;
        }
        .pp-action {
            display: flex; align-items: center; justify-content: center;
            color: var(--text); cursor: pointer;
            transition: opacity 0.2s; background: none; border: none;
        }
        .pp-action:active { opacity: 0.5; transform: scale(0.9); }
        .pp-action svg { width: 22px; height: 22px; }
        .pp-action.primary svg { width: 26px; height: 26px; }

        .pp-section { padding: 18px 16px 2px; }
        .pp-section-title {
            font-size: 15px; font-weight: 600;
            color: var(--text); margin-bottom: 10px;
        }
        .pp-hscroll {
            display: flex; gap: 10px;
            overflow-x: auto; padding-bottom: 4px;
            scrollbar-width: none;
        }
        .pp-hscroll::-webkit-scrollbar { display: none; }

        .pp-details-text {
            font-size: 12px; line-height: 1.65;
            color: var(--text-muted);
        }

        /* Episode card (horizontal scroll preview) */
        .pp-ep-card {
            min-width: 120px; border-radius: 12px;
            overflow: hidden; border: 1px solid var(--border);
            background: rgba(0,0,0,0.3);
            cursor: pointer; flex-shrink: 0;
            transition: transform 0.15s;
        }
        .pp-ep-card:active { transform: scale(0.97); }
        .pp-ep-thumb {
            height: 76px;
            background:
                radial-gradient(80px 60px at 30% 20%, rgba(255,255,255,0.06), transparent 70%),
                repeating-linear-gradient(120deg, rgba(0,0,0,0.2) 0 3px, rgba(255,255,255,0.02) 3px 6px);
            display: flex; align-items: flex-start; padding: 8px;
        }
        .pp-ep-num {
            font-size: 18px; font-weight: 700;
            color: var(--text);
            text-shadow: 0 2px 10px rgba(0,0,0,0.8);
        }
        .pp-ep-info { padding: 8px 10px 10px; }
        .pp-ep-info .pp-ep-title { font-size: 11px; color: var(--text-muted); margin-bottom: 2px; }
        .pp-ep-info .pp-ep-date { font-size: 10px; color: var(--text-muted); opacity: 0.6; }

        /* Poster cards (recommendations/similar) */
        .pp-poster-card { min-width: 120px; flex-shrink: 0; cursor: pointer; }
        .pp-poster-thumb {
            height: 170px; border-radius: 12px;
            border: 1px solid var(--border);
            overflow: hidden; position: relative;
            background-size: cover; background-position: center;
        }
        .pp-poster-badges {
            position: absolute; bottom: 6px; left: 6px; right: 6px;
            display: flex; gap: 4px; align-items: center;
            font-size: 9px;
        }
        .pp-pb-format {
            background: rgba(0,0,0,0.6);
            padding: 2px 5px; border-radius: 4px;
            font-weight: 700; color: var(--text);
        }
        .pp-pb-rating { color: var(--text); font-weight: 600; text-shadow: 0 1px 4px rgba(0,0,0,0.8); }
        .pp-pb-year { color: var(--text-muted); margin-left: auto; text-shadow: 0 1px 4px rgba(0,0,0,0.8); }
        .pp-poster-title {
            font-size: 11px; color: var(--text-muted);
            margin-top: 6px; line-height: 1.3;
        }

        /* ── VIDEO CONTAINER (between pages or overlay) ── */
        .pp-video-container {
            position: relative;
            width: 100%;
            background: #000;
            display: none;
        }
        .pp-video-container.active { display: block; }
        .pp-video-container video { width: 100%; display: block; }
        .pp-video-fs-btn {
            position: absolute; bottom: 8px; right: 8px;
            width: 36px; height: 36px; border-radius: 50%;
            background: rgba(0,0,0,0.5);
            border: 1px solid var(--border);
            display: flex; align-items: center; justify-content: center;
            cursor: pointer; color: var(--text); z-index: 5;
        }

        /* ── EPISODES PAGE (Page 2) ── */
        .pp-episodes-page { background: var(--bg); min-height: 100vh; }

        .pp-ep-topbar {
            display: flex; align-items: center; gap: 10px;
            padding: 16px;
            position: sticky; top: 0;
            background: var(--bg);
            z-index: 10;
            border-bottom: 1px solid var(--border);
        }
        .pp-ep-tabs {
            display: flex; gap: 8px; flex: 1;
            overflow-x: auto; scrollbar-width: none;
        }
        .pp-ep-tabs::-webkit-scrollbar { display: none; }
        .pp-ep-tab {
            padding: 8px 16px; border-radius: 20px;
            font-size: 13px; font-weight: 500;
            color: var(--text-muted);
            background: rgba(var(--accent-rgb), 0.04);
            border: 1px solid var(--border);
            white-space: nowrap; cursor: pointer;
            transition: all 0.2s; flex-shrink: 0;
        }
        .pp-ep-tab.active {
            background: rgba(var(--accent-rgb), 0.12);
            color: var(--text);
        }

        .pp-view-tabs {
            display: flex; gap: 6px;
            padding: 12px 16px 8px;
        }
        .pp-view-tab {
            padding: 5px 14px; border-radius: 20px;
            font-size: 12px; font-weight: 500;
            color: var(--text-muted);
            background: transparent;
            border: 1px solid var(--border);
            cursor: pointer; transition: all 0.2s;
        }
        .pp-view-tab.active {
            background: rgba(var(--accent-rgb), 0.06);
            color: var(--text);
        }

        .pp-season-select {
            display: flex; align-items: center; gap: 10px;
            padding: 0 16px 12px;
            font-size: 13px; color: var(--text-muted);
            overflow-x: auto; scrollbar-width: none;
        }
        .pp-season-num {
            width: 36px; height: 36px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-size: 14px; font-weight: 600;
            color: var(--text-muted);
            background: rgba(var(--accent-rgb), 0.04);
            border: 1px solid var(--border);
            cursor: pointer; flex-shrink: 0;
            transition: all 0.2s;
        }
        .pp-season-num.active {
            background: rgba(var(--accent-rgb), 0.12);
            color: var(--text);
            border-color: rgba(var(--accent-rgb), 0.3);
        }

        .pp-episodes-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            padding: 0 16px 30px;
        }

        .pp-ep-grid-card {
            border-radius: 14px; overflow: hidden;
            border: 1px solid var(--border);
            background: rgba(0,0,0,0.2);
            cursor: pointer; transition: transform 0.15s;
        }
        .pp-ep-grid-card:active { transform: scale(0.97); }
        .pp-ep-grid-thumb {
            position: relative; height: 100px;
            background:
                radial-gradient(100px 80px at 30% 20%, rgba(255,255,255,0.06), transparent 70%),
                repeating-linear-gradient(120deg, rgba(0,0,0,0.2) 0 3px, rgba(255,255,255,0.02) 3px 6px);
            display: flex; align-items: flex-start; padding: 8px;
        }
        .pp-ep-grid-num {
            font-size: 14px; font-weight: 700;
            color: var(--text);
            background: rgba(0,0,0,0.5);
            padding: 3px 8px; border-radius: 6px;
            backdrop-filter: blur(8px);
        }
        .pp-ep-grid-info { padding: 10px 12px 12px; }
        .pp-ep-grid-title {
            font-size: 13px; font-weight: 600;
            color: var(--text); margin-bottom: 6px;
        }
        .pp-ep-grid-meta {
            display: flex; align-items: center; gap: 6px;
            font-size: 11px; color: var(--text-muted);
        }
        .pp-ep-grid-rating { color: var(--text); font-weight: 600; }
        .pp-ep-grid-progress {
            width: 100%; height: 3px;
            background: rgba(var(--accent-rgb), 0.08);
            border-radius: 2px; margin-top: 8px;
            overflow: hidden;
        }
        .pp-ep-grid-progress-bar {
            height: 100%;
            background: var(--accent);
            border-radius: 2px;
        }

        /* Compact view */
        .pp-ep-compact-card {
            display: flex; align-items: center; gap: 10px;
            padding: 10px 12px;
            border: 1px solid var(--border);
            border-radius: 12px;
            background: rgba(0,0,0,0.2);
            cursor: pointer;
            grid-column: 1/-1;
            transition: transform 0.15s;
        }
        .pp-ep-compact-card:active { transform: scale(0.98); }
        .pp-ep-compact-num {
            font-size: 16px; font-weight: 700;
            min-width: 28px; text-align: center;
            color: var(--text);
        }
        .pp-ep-compact-info { flex: 1; min-width: 0; }
        .pp-ep-compact-title { font-size: 13px; font-weight: 600; color: var(--text); }
        .pp-ep-compact-meta { font-size: 11px; color: var(--text-muted); margin-top: 2px; }
        .pp-ep-compact-progress {
            width: 50px; height: 3px;
            background: rgba(var(--accent-rgb), 0.08);
            border-radius: 2px; overflow: hidden;
        }
        .pp-ep-compact-progress-bar {
            height: 100%; background: var(--accent); border-radius: 2px;
        }

        /* Classic view */
        .pp-ep-classic-card {
            display: flex; align-items: center; gap: 12px;
            padding: 10px 12px;
            border-bottom: 1px solid var(--border);
            cursor: pointer;
            grid-column: 1/-1;
            transition: background 0.15s;
        }
        .pp-ep-classic-num {
            font-size: 14px; font-weight: 600;
            min-width: 24px; color: var(--text-muted);
        }
        .pp-ep-classic-title { font-size: 13px; color: var(--text); flex: 1; }
        .pp-ep-classic-meta { font-size: 11px; color: var(--text-muted); }

        .pp-ep-empty {
            grid-column: 1/-1;
            text-align: center; padding: 2rem 1rem;
            color: var(--text-muted); font-size: 13px;
        }

        /* ── Bottom Sheet (keep existing but adapted) ── */
        .bottom-sheet-overlay {
            position: fixed; inset: 0; z-index: 3000;
            background: rgba(0,0,0,0.55);
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            display: none;
            align-items: flex-end; justify-content: center;
            padding: 0 0.5rem 0.5rem;
        }
        .bottom-sheet-overlay.open {
            display: flex; animation: bsOverlayIn 0.25s ease;
        }
        @keyframes bsOverlayIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes bsSheetIn { from { transform: translateY(100%); } to { transform: translateY(0); } }
        .bottom-sheet {
            width: 100%; max-width: 480px;
            background: var(--surface);
            backdrop-filter: blur(24px) saturate(180%);
            -webkit-backdrop-filter: blur(24px) saturate(180%);
            border: 1px solid var(--border);
            border-radius: 20px 20px 0 0;
            padding: 0.5rem 1rem 1.2rem;
            max-height: 80vh; overflow-y: auto;
            animation: bsSheetIn 0.3s cubic-bezier(.2,.9,.2,1);
        }
        .bottom-sheet-handle {
            width: 36px; height: 4px;
            border-radius: 2px;
            background: var(--text-muted);
            margin: 0.5rem auto 0.8rem;
            opacity: 0.4;
        }
        .bottom-sheet-title {
            font-size: 1rem; font-weight: 700;
            color: var(--text); margin-bottom: 0.8rem;
            text-align: center;
        }
        .bottom-sheet-section { margin-bottom: 1rem; }
        .bottom-sheet-section-title {
            font-size: 0.72rem; font-weight: 700;
            text-transform: uppercase; letter-spacing: 0.06em;
            color: var(--text-muted); margin-bottom: 0.5rem;
        }
        .bottom-sheet-item {
            display: flex; align-items: center;
            justify-content: space-between;
            padding: 0.65rem 0.8rem;
            border-radius: var(--radius-sm);
            background: rgba(var(--accent-rgb), 0.03);
            border: 1px solid var(--border);
            color: var(--text);
            cursor: pointer; margin-bottom: 0.4rem;
            font-size: 0.88rem; font-weight: 600;
            transition: all 0.2s;
        }
        .bottom-sheet-item:active { transform: scale(0.98); }
        .bottom-sheet-item.selected {
            border-color: var(--accent);
            background: rgba(var(--accent-rgb), 0.08);
        }
        .bottom-sheet-item-check { color: var(--accent); font-weight: 700; }
        .bottom-sheet-quality-row {
            display: flex; gap: 0.5rem; flex-wrap: wrap;
        }
        .bottom-sheet-quality-btn {
            padding: 0.5rem 1rem;
            border-radius: var(--radius-sm);
            border: 1px solid var(--border);
            background: rgba(var(--accent-rgb), 0.03);
            color: var(--text);
            font-size: 0.85rem; font-weight: 700;
            cursor: pointer; font-family: inherit;
            transition: all 0.2s;
        }
        .bottom-sheet-quality-btn.active-q {
            border-color: var(--accent);
            background: rgba(var(--accent-rgb), 0.08);
            color: var(--accent);
        }
        .bottom-sheet-close {
            width: 100%; padding: 0.7rem;
            margin-top: 0.5rem;
            background: rgba(var(--accent-rgb), 0.06);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            color: var(--text); font-size: 0.9rem;
            font-weight: 600; cursor: pointer; font-family: inherit;
        }
        .bottom-sheet-apply {
            width: 100%; padding: 0.7rem;
            margin-top: 0.5rem;
            background: var(--accent); color: var(--accent-text);
            border: none; border-radius: var(--radius-sm);
            font-size: 0.9rem; font-weight: 700;
            cursor: pointer; font-family: inherit;
            transition: all 0.2s;
        }
        .bottom-sheet-apply:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(var(--accent-rgb), 0.3);
        }

        .toast {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: var(--accent);
            color: var(--accent-text);
            padding: 0.6rem 1.2rem;
            border-radius: var(--radius-xl);
            font-weight: 600;
            font-size: 0.8rem;
            z-index: 9999;
            transition: transform 0.3s ease, opacity 0.3s ease;
            box-shadow: var(--shadow-lg);
            pointer-events: none;
            opacity: 0;
            max-width: 90%;
            text-align: center;
        }
        @media (min-width:480px) {
            .toast {
                padding: 0.7rem 1.5rem;
                font-size: 0.85rem;
                bottom: 30px;
            }
        }
        .toast.show {
            transform: translateX(-50%) translateY(0);
            opacity: 1;
        }

        .back-to-top {
            position: fixed;
            bottom: 1.5rem;
            right: 1.5rem;
            z-index: 100;
            background: var(--surface);
            border: 2px solid var(--border);
            color: var(--text);
            border-radius: 50%;
            width: 48px;
            min-width: 48px;
            height: 48px;
            min-height: 48px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 1.1rem;
            box-shadow: var(--shadow-md);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            opacity: 0;
            pointer-events: none;
            transform: translateY(20px);
        }
        @media (min-width:480px) {
            .back-to-top {
                bottom: 2rem;
                right: 2rem;
                font-size: 1.2rem;
            }
        }
        .back-to-top.visible {
            opacity: 1;
            pointer-events: auto;
            transform: translateY(0);
        }
        .back-to-top:hover {
            background: var(--accent);
            color: var(--accent-text);
            border-color: var(--accent);
            transform: translateY(-4px);
            box-shadow: 0 8px 24px var(--accent-glow);
        }

        footer {
            margin-top: 2rem;
            text-align: center;
            font-size: 0.6rem;
            border-top: 1px solid var(--border);
            padding-top: 1.2rem;
            color: var(--text-muted);
            line-height: 1.6;
        }
        @media (min-width:480px) {
            footer {
                font-size: 0.65rem;
                padding-top: 1.4rem;
                margin-top: 2.5rem;
            }
        }
        @media (min-width:768px) {
            footer {
                font-size: 0.7rem;
                padding-top: 1.8rem;
                margin-top: 3rem;
            }
        }

        .btn-primary {
            background: var(--accent-gradient);
            color: var(--accent-text);
            border: none;
            border-radius: var(--radius-xl);
            padding: 0.6rem 1.2rem;
            font-weight: 700;
            font-size: 0.85rem;
            cursor: pointer;
            transition: all var(--transition);
            box-shadow: 0 4px 14px var(--accent-glow);
            font-family: inherit;
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            min-height: 44px;
            min-width: 44px;
        }
        @media (min-width:480px) {
            .btn-primary {
                padding: 0.65rem 1.5rem;
                font-size: 0.9rem;
            }
        }
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 24px var(--accent-glow);
        }

        .btn-outline {
            background: transparent;
            border: 1.5px solid var(--border);
            color: var(--text);
            border-radius: var(--radius-xl);
            padding: 0.4rem 0.9rem;
            font-weight: 600;
            font-size: 0.75rem;
            cursor: pointer;
            transition: all var(--transition);
            white-space: nowrap;
            box-shadow: var(--shadow-sm);
            font-family: inherit;
            min-height: 44px;
            min-width: 44px;
            display: inline-flex;
            align-items: center;
            gap: 0.3rem;
        }
        @media (min-width:480px) {
            .btn-outline {
                padding: 0.45rem 1.1rem;
                font-size: 0.8rem;
                min-height: 40px;
            }
        }
        @media (min-width:768px) {
            .btn-outline {
                padding: 0.5rem 1.3rem;
                font-size: 0.85rem;
                min-height: auto;
            }
        }
        .btn-outline:hover {
            background: var(--accent);
            color: var(--accent-text);
            border-color: var(--accent);
            transform: translateY(-1px);
            box-shadow: 0 6px 18px var(--accent-glow);
        }
        .btn-outline:disabled {
            opacity: 0.4;
            pointer-events: none;
            cursor: not-allowed;
        }

        .page-indicator {
            margin: 0 0.5rem;
            font-weight: 700;
            font-size: 0.8rem;
            color: var(--text);
            user-select: none;
        }
        @media (min-width:480px) {
            .page-indicator {
                font-size: 0.85rem;
                margin: 0 0.7rem;
            }
        }
        @media (min-width:768px) {
            .page-indicator {
                font-size: 0.9rem;
                margin: 0 1rem;
            }
        }

        .pagination-row {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 0.4rem;
            margin-top: 1.5rem;
            flex-wrap: wrap;
        }
        @media (min-width:480px) {
            .pagination-row {
                gap: 0.5rem;
                margin-top: 2rem;
            }
        }
        @media (min-width:768px) {
            .pagination-row {
                gap: 0.6rem;
                margin-top: 2.5rem;
            }
        }

        .skeleton {
            background: var(--tag-bg);
            background-image: linear-gradient(90deg, var(--tag-bg) 0px, var(--border-light) 40px, var(--tag-bg) 80px);
            background-size: 200px 100%;
            animation: skeletonShimmer 1.6s infinite;
            border-radius: var(--radius-sm);
        }

        .img--blur {
            filter: blur(10px) scale(1.02);
            transform-origin: center;
            transition: filter 600ms ease, transform 600ms ease;
        }
        .img--loaded {
            filter: blur(0) scale(1);
        }

        .glass {
            background: linear-gradient(180deg, var(--glass), rgba(255, 255, 255, 0.03));
            backdrop-filter: blur(var(--blur-amount));
            border: 1px solid var(--border);
            border-radius: var(--radius);
        }

        .hidden {
            display: none !important;
        }

        .auth-card {
            background: var(--surface);
            border-radius: var(--radius-lg);
            border: 1px solid var(--border);
            padding: 2rem 1.5rem 1.8rem;
            box-shadow: var(--shadow-lg);
            max-width: 420px;
            margin: 0 auto;
            position: relative;
            overflow: hidden;
        }
        .auth-card .mark {
            width: 34px;
            height: 34px;
            border-radius: 9px;
            background: linear-gradient(155deg, #fff, #b8b8b6);
            margin-bottom: 18px;
            position: relative;
        }
        .auth-card .mark::after {
            content: '';
            position: absolute;
            inset: 10px;
            border-radius: 4px;
            background: var(--bg);
        }
        .dark-mode .auth-card .mark::after {
            background: var(--bg);
        }
        .auth-card h1 {
            font-size: 22px;
            font-weight: 600;
            letter-spacing: -0.02em;
            margin-bottom: 4px;
            color: var(--text);
        }
        .auth-card .sub {
            font-size: 13.5px;
            color: var(--text-muted);
            margin-bottom: 22px;
            line-height: 1.5;
        }
        .auth-card .switcher {
            display: flex;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid var(--border);
            border-radius: 11px;
            padding: 3px;
            margin-bottom: 20px;
            position: relative;
        }
        .auth-card .switcher button {
            flex: 1;
            padding: 9px 0;
            border: none;
            background: transparent;
            color: var(--text-muted);
            font-size: 13.5px;
            font-weight: 500;
            font-family: inherit;
            border-radius: 8px;
            cursor: pointer;
            position: relative;
            z-index: 1;
            transition: color 0.25s ease;
        }
        .auth-card .switcher button.active {
            color: var(--accent-text);
        }
        .auth-card .switcher-thumb {
            position: absolute;
            top: 3px;
            left: 3px;
            width: calc(50% - 3px);
            height: calc(100% - 6px);
            background: var(--accent);
            border-radius: 8px;
            transition: transform 0.32s cubic-bezier(.65, 0, .35, 1);
            z-index: 0;
        }
        .auth-card .switcher.mode-register .switcher-thumb {
            transform: translateX(calc(100% + 3px));
        }
        .auth-card .google-btn {
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 11px 0;
            border-radius: 11px;
            border: 1px solid var(--border);
            background: rgba(255, 255, 255, 0.03);
            color: var(--text);
            font-family: inherit;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: background 0.2s ease, border-color 0.2s ease, transform 0.15s ease;
        }
        .auth-card .google-btn:hover {
            background: rgba(255, 255, 255, 0.08);
            border-color: rgba(255, 255, 255, 0.18);
        }
        .auth-card .google-btn:active {
            transform: scale(0.98);
        }
        .auth-card .google-btn svg {
            width: 18px;
            height: 18px;
        }
        .auth-card .divider {
            display: flex;
            align-items: center;
            gap: 14px;
            margin: 20px 0;
            color: var(--text-muted);
            font-size: 12px;
        }
        .auth-card .divider::before,
        .auth-card .divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: var(--border);
        }
        .auth-card form {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }
        .auth-card .field {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }
        .auth-card .field label {
            font-size: 12.5px;
            color: var(--text-muted);
            font-weight: 500;
        }
        .auth-card .field input {
            background: rgba(255, 255, 255, 0.035);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 11px 13px;
            color: var(--text);
            font-size: 14px;
            font-family: inherit;
            outline: none;
            transition: border-color 0.2s ease, background 0.2s ease;
        }
        .auth-card .field input::placeholder {
            color: var(--text-muted);
        }
        .auth-card .field input:focus {
            border-color: rgba(255, 255, 255, 0.35);
            background: rgba(255, 255, 255, 0.06);
        }
        .auth-card .field input:focus-visible {
            outline: 2px solid rgba(255, 255, 255, 0.4);
            outline-offset: 1px;
        }
        .auth-card .row-between {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 12.5px;
        }
        .auth-card .row-between a {
            color: var(--text-muted);
            text-decoration: none;
        }
        .auth-card .row-between a:hover {
            color: var(--text);
        }
        .auth-card .remember {
            display: flex;
            align-items: center;
            gap: 7px;
            color: var(--text-muted);
        }
        .auth-card .remember input {
            accent-color: #fff;
            width: 14px;
            height: 14px;
        }
        .auth-card .submit-btn {
            margin-top: 4px;
            width: 100%;
            padding: 12px 0;
            border-radius: 11px;
            border: none;
            background: var(--accent);
            color: var(--accent-text);
            font-family: inherit;
            font-size: 14.5px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.15s ease, background 0.2s ease;
        }
        .auth-card .submit-btn:hover {
            background: var(--accent-hover);
        }
        .auth-card .submit-btn:active {
            transform: scale(0.98);
        }
        .auth-card .guest-btn {
            width: 100%;
            margin-top: 10px;
            padding: 11px 0;
            border-radius: 11px;
            border: 1px dashed var(--border);
            background: transparent;
            color: var(--text-muted);
            font-family: inherit;
            font-size: 13.5px;
            font-weight: 500;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: color 0.2s ease, border-color 0.2s ease, background 0.2s ease;
        }
        .auth-card .guest-btn:hover {
            color: var(--text);
            border-color: rgba(255, 255, 255, 0.28);
            background: rgba(255, 255, 255, 0.03);
        }
        .auth-card .guest-btn:active {
            transform: scale(0.98);
        }
        .auth-card .guest-btn svg {
            width: 15px;
            height: 15px;
            opacity: 0.8;
        }
        .auth-card .panel {
            display: none;
        }
        .auth-card .panel.active {
            display: flex;
            flex-direction: column;
        }
        .auth-card .foot-note {
            text-align: center;
            margin-top: 18px;
            font-size: 13px;
            color: var(--text-muted);
        }
        .auth-card .foot-note button {
            background: none;
            border: none;
            color: var(--text);
            font-family: inherit;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            text-decoration: underline;
            text-underline-offset: 2px;
        }
        .auth-card .auth-error {
            color: #ff6b6b;
            font-size: 13px;
            text-align: center;
            margin-top: 8px;
            min-height: 20px;
        }
        .auth-card .auth-loading {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid rgba(255, 255, 255, 0.2);
            border-top-color: #fff;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            vertical-align: middle;
            margin-right: 6px;
        }
    
        /* Logo always white text + blur backdrop */
        .logo-text h1,
        .logo-icon,
        .logo-text span {
            color: #ffffff !important;
            text-shadow: 0 1px 8px rgba(0,0,0,0.5);
        }
        body:not(.dark-mode) .logo-text h1,
        body:not(.dark-mode) .logo-icon,
        body:not(.dark-mode) .logo-text span {
            color: #ffffff !important;
        }
        /* Logo blur backdrop like the watch button */
        .logo {
            display: flex;
            align-items: center;
            cursor: pointer;
            padding: 0.4rem 0.9rem 0.4rem 0.7rem;
            border-radius: 14px;
            background: rgba(255,255,255,0.12) !important;
            backdrop-filter: blur(18px) saturate(140%) !important;
            -webkit-backdrop-filter: blur(18px) saturate(140%) !important;
            border: 1px solid rgba(255,255,255,0.18) !important;
            transition: background 0.25s ease, box-shadow 0.25s ease;
            text-decoration: none;
        }
        .logo:hover {
            background: rgba(255,255,255,0.2) !important;
            box-shadow: 0 4px 20px rgba(0,0,0,0.2);
        }
        .logo-title-row {
            display: flex;
            align-items: center;
            gap: 0.4rem;
        }
        .logo-text h1 {
            font-size: 1.25rem;
            font-weight: 800;
            letter-spacing: 0.02em;
            line-height: 1.1;
            color: #ffffff !important;
        }
        .logo-text span {
            font-size: 0.7rem;
            opacity: 0.85;
            color: #ffffff !important;
            display: block;
            line-height: 1.2;
        }
        /* Hide clock */
        .agnative-topnav-clock {
            display: none !important;
        }

        /* ===== Header layout — burger + title + search в одному рядку ===== */
        .header-left {
            display: flex;
            align-items: center;
            gap: 0.6rem;
            flex: 1;
            min-width: 0;
        }
        .header-actions {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            flex-shrink: 0;
        }
        .header {
            align-items: center !important;
        }

        /* ===== Burger + Search buttons — glassmorphism blur ===== */
        .burger-btn,
        .search-circle-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 46px;
            height: 46px;
            border-radius: 50%;
            background: rgba(255,255,255,0.12) !important;
            backdrop-filter: blur(18px) saturate(140%) !important;
            -webkit-backdrop-filter: blur(18px) saturate(140%) !important;
            border: 1px solid rgba(255,255,255,0.18) !important;
            color: #ffffff !important;
            cursor: pointer;
            font-size: 1rem;
            transition: background 0.25s ease, box-shadow 0.25s ease, transform 0.2s ease;
            box-shadow: none;
            flex-shrink: 0;
        }
        body:not(.dark-mode) .burger-btn,
        body:not(.dark-mode) .search-circle-btn {
            color: #ffffff !important;
        }
        .burger-btn:hover,
        .search-circle-btn:hover {
            background: rgba(255,255,255,0.22) !important;
            box-shadow: 0 4px 20px rgba(0,0,0,0.25);
            transform: scale(1.06);
        }
        .burger-btn i,
        .search-circle-btn i {
            color: #ffffff !important;
        }

        /* ====================================================================
           BOTTOM NAV BAR
           ==================================================================== */
        .bottom-nav {
            position: fixed;
            bottom: 16px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1000;
            width: calc(100% - 32px);
            max-width: 420px;
            background: rgba(255, 255, 255, 0.72);
            border: 1px solid rgba(255, 255, 255, 0.55);
            border-radius: 26px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.10), 0 2px 8px rgba(0,0,0,0.06);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 8px 10px;
            backdrop-filter: blur(24px) saturate(180%);
            -webkit-backdrop-filter: blur(24px) saturate(180%);
            transition: transform 0.3s cubic-bezier(.2,.9,.2,1), opacity 0.3s;
        }
        .dark-mode .bottom-nav {
            background: rgba(18, 18, 18, 0.72);
            border-color: rgba(255,255,255,0.08);
        }
        .bottom-nav.hidden-nav {
            transform: translateX(-50%) translateY(120%);
            opacity: 0;
            pointer-events: none;
        }
        .bn-item {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            border: none;
            background: none;
            padding: 0;
            position: relative;
            transition: transform 0.15s;
        }
        .bn-item:active {
            transform: scale(0.92);
        }
        .bn-pill {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            padding: 8px 10px;
            border-radius: 50px;
            transition: background 0.22s cubic-bezier(.2,.9,.2,1), padding 0.22s cubic-bezier(.2,.9,.2,1), color 0.22s;
            color: var(--text-muted);
            font-size: 14px;
            font-weight: 600;
            letter-spacing: -0.01em;
            white-space: nowrap;
        }
        .bn-item.active .bn-pill {
            background: var(--text);
            color: var(--bg);
            padding: 10px 18px;
        }
        .bn-pill svg {
            width: 22px;
            height: 22px;
            stroke: currentColor;
            fill: none;
            stroke-width: 1.7;
            stroke-linecap: round;
            stroke-linejoin: round;
            flex-shrink: 0;
            transition: stroke 0.22s;
        }
        .bn-label {
            font-size: 13.5px;
            font-weight: 600;
            display: none;
        }
        .bn-item.active .bn-label {
            display: inline;
        }
        @media (min-width: 900px) {
            .bottom-nav { display: none; }
        }
        @supports (padding-bottom: env(safe-area-inset-bottom)) {
            .bottom-nav {
                bottom: calc(12px + env(safe-area-inset-bottom));
            }
        }
        .app-container { padding-bottom: 90px !important; }
        /* Коли суспільне активне — прибираємо padding, чат займає весь екран */
        body.community-active .app-container { padding-bottom: 0 !important; }
        body.community-active #ratingPageContainer { padding-bottom: 0; }

        
        /* ═══════════════════════════════════════════════════════
           RATING & COMMUNITY — redesign v2 (profile-style)
           ═══════════════════════════════════════════════════════ */

        #ratingPageContainer {
            display: none;
            min-height: 100vh;
            padding-bottom: 80px;
            animation: fadeInUp 0.28s cubic-bezier(.2,.9,.2,1) both;
        }
        #ratingPageContainer.active { display: block; }

        /* ── Main Tabs (profile-style) ── */
        .rg-main-tabs {
            display: flex;
            gap: 4px;
            padding: 5px;
            background: var(--surface);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 14px;
            border: 1px solid var(--border);
            box-shadow: var(--shadow-sm);
            margin: 0.8rem 1rem;
        }
        .rg-main-tab {
            flex: 1;
            padding: 8px 6px;
            border-radius: 10px;
            font-size: 12px;
            font-weight: 600;
            text-align: center;
            cursor: pointer;
            color: var(--text-muted);
            transition: all .25s ease;
            border: none;
            background: none;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
            font-family: inherit;
            min-height: 40px;
            letter-spacing: 0.01em;
        }
        .rg-main-tab svg { width: 14px; height: 14px; }
        .rg-main-tab:hover { color: var(--text-secondary); }
        .rg-main-tab.active {
            background: rgba(var(--accent-rgb), 0.08);
            color: var(--text);
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
        }
        .dark-mode .rg-main-tab.active { background: rgba(255,255,255,0.08); }

        .rg-tab-panel { display: none; animation: fadeInUp 0.25s ease; }
        .rg-tab-panel.active { display: block; }

        /* ══════════════ RATING PANEL ══════════════ */

        .rg-my-stats {
            margin: 1rem 1rem 0;
            background: var(--surface);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            padding: 1.1rem;
            box-shadow: var(--shadow-sm);
        }
        .rg-stats-top {
            display: flex;
            align-items: center;
            gap: 0.9rem;
            margin-bottom: 0.9rem;
        }
        .rg-stats-avatar {
            width: 50px; height: 50px;
            border-radius: 50%;
            overflow: hidden;
            border: 2px solid var(--border);
            flex-shrink: 0;
            display: flex; align-items: center; justify-content: center;
            font-size: 1.2rem; font-weight: 700;
            background: var(--tag-bg);
            color: var(--text-secondary);
        }
        .rg-stats-avatar img { width:100%; height:100%; object-fit:cover; filter: grayscale(60%) contrast(1.05); }
        .rg-stats-name { font-size: 16px; font-weight: 700; color: var(--text); letter-spacing: -0.3px; }
        .rg-stats-rank-badge {
            display: inline-flex; align-items: center; gap: 0.25rem;
            padding: 2px 8px;
            border-radius: 20px;
            font-size: 10px; font-weight: 700;
            color: #fff;
            margin-top: 4px;
            letter-spacing: 0.3px;
        }
        .rg-stats-grid {
            display: flex; gap: 8px;
        }
        .rg-stat-cell {
            flex: 1;
            background: rgba(var(--accent-rgb), 0.04);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            padding: 10px 8px;
            text-align: center;
            transition: all .25s;
        }
        .rg-stat-cell:hover { background: rgba(var(--accent-rgb), 0.07); border-color: var(--border-hover); }
        .rg-stat-val { font-size: 18px; font-weight: 700; color: var(--text); }
        .rg-stat-val.gold { color: #F59E0B; }
        .rg-stat-label {
            font-size: 9px; font-weight: 600;
            text-transform: uppercase; letter-spacing: 1px;
            color: var(--text-muted); margin-top: 2px;
        }

        /* Achievements */
        .rg-achievements {
            margin: 1rem 1rem 0;
        }
        .rg-section-label {
            font-size: 11px; font-weight: 600;
            text-transform: uppercase; letter-spacing: 1.5px;
            color: var(--text-secondary);
            padding: 0 2px 0.55rem;
        }
        .rg-ach-scroll {
            display: flex; gap: 0.55rem;
            overflow-x: auto;
            padding-bottom: 0.4rem;
            scrollbar-width: none;
        }
        .rg-ach-scroll::-webkit-scrollbar { display: none; }
        .rg-ach-item {
            flex-shrink: 0;
            display: flex; flex-direction: column; align-items: center;
            gap: 0.3rem;
            padding: 0.65rem 0.7rem;
            border-radius: var(--radius-sm);
            border: 1px solid var(--border);
            background: var(--surface);
            min-width: 68px;
            text-align: center;
            transition: all 0.2s;
            backdrop-filter: blur(20px);
        }
        .rg-ach-item.earned {
            border-color: rgba(var(--accent-rgb), 0.4);
            background: rgba(var(--accent-rgb), 0.06);
        }
        .rg-ach-item.locked { opacity: 0.35; }
        .rg-ach-icon { font-size: 1.3rem; }
        .rg-ach-name { font-size: 10px; font-weight: 700; color: var(--text); line-height: 1.2; }
        .rg-ach-req { font-size: 9px; color: var(--text-muted); }

        /* Sort tabs */
        .rg-sort-tabs {
            display: flex; gap: 0.4rem;
            padding: 1rem 1rem 0.5rem;
            overflow-x: auto; scrollbar-width: none;
        }
        .rg-sort-tabs::-webkit-scrollbar { display: none; }
        .rg-sort-tab {
            flex-shrink: 0;
            padding: 5px 12px;

        .rg-podium-item.p3 .rg-podium-avatar { border-color: #B45309; }

        .rg-podium-name {
            font-size: 10px; font-weight: 700; color: var(--text-secondary);
            text-align: center; max-width: 88px;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;

        .rg-podium-item.p2 .rg-podium-bar { height: 28px; }
        .rg-podium-item.p3 .rg-podium-bar { height: 18px; }

        /* List */

        .rg-lb-item {
            display: flex; align-items: center; gap: 0.7rem;

            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            backdrop-filter: blur(20px);

        .rg-lb-num {
            width: 20px; font-size: 11px; font-weight: 700;
            color: var(--text-muted); text-align: center; flex-shrink: 0;

        /* ══════════════ COMMUNITY CHAT ══════════════ */

        .com-chat-wrap {
            display: flex;
            flex-direction: column;

            height: calc(100dvh - 130px);
            min-height: 360px;
            position: relative;
        }
        @supports not (height: 100dvh) {
            .com-chat-wrap { height: calc(100vh - 130px); }
        }

        /* Messages area */
        .com-messages {
            flex: 1;
            overflow-y: auto;
            overflow-x: hidden;
            padding: 0.8rem 0.9rem 0.4rem;
            display: flex;
            flex-direction: column;
            gap: 3px;
            scrollbar-width: thin;
            scrollbar-color: var(--border) transparent;
            overscroll-behavior: contain;
            -webkit-overflow-scrolling: touch;

        .com-messages::-webkit-scrollbar { width: 4px; }

        .com-date-sep {
            display: flex; align-items: center; gap: 0.6rem;

            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 20px;

        /* Message bubble — others */

        .com-msg-name {
            font-size: 10px; font-weight: 700;
            color: var(--text-secondary);
            padding: 0 4px;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;

        .com-msg.mine .com-msg-name { display: none; }

        .com-msg-bubble {
            padding: 7px 11px;
            border-radius: 16px;
            font-size: 13px; line-height: 1.55;
            word-break: break-word; color: var(--text);

            border: 1px solid var(--border);
            backdrop-filter: blur(20px);
            position: relative;

        .com-msg.mine .com-msg-bubble {

            border-bottom-right-radius: 4px;

        .com-msg-type {
            display: inline-flex; align-items: center; gap: 4px;
            font-size: 9px; font-weight: 700; letter-spacing: 0.5px;

        .com-msg-text { }

        .com-msg-time {
            font-size: 9px; color: var(--text-muted);
            padding: 0 4px;

        /* Input area */
        .com-input-wrap {
            display: flex;
            align-items: flex-end;
            gap: 0.5rem;

        .com-input-box {
            flex: 1;
            display: flex;
            align-items: flex-end;
            gap: 0;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 6px 10px 6px 14px;
            transition: border-color .2s;
            backdrop-filter: blur(20px);
        }
        .com-input-box:focus-within { border-color: rgba(var(--accent-rgb), 0.5); }
        .com-input-box textarea {
            flex: 1; background: transparent;

            line-height: 1.5; padding: 2px 0;
        }
        .com-input-box textarea::placeholder { color: var(--text-muted); }

        /* Type selector inside input */
        .com-type-btn {
            flex-shrink: 0;
            width: 24px; height: 24px;
            display: flex; align-items: center; justify-content: center;
            background: none; border: none; cursor: pointer;
            color: var(--text-muted); transition: color .2s;
            align-self: flex-end; margin-bottom: 2px;

        .com-type-btn:hover { color: var(--text-secondary); }
        .com-type-btn svg { width: 14px; height: 14px; }
        .com-type-btn.active { color: var(--accent-text); }

        .com-send-btn {
            flex-shrink: 0;
            width: 38px; height: 38px;

        }
        .com-send-btn:hover { background: var(--accent); color: #fff; border-color: var(--accent); }
        .com-send-btn:disabled { opacity: 0.4; cursor: default; }
        .com-send-btn svg { width: 15px; height: 15px; }

        /* Type menu popup */
        .com-type-menu {
            position: absolute;
            bottom: calc(100% + 8px);
            left: 0;
            background: var(--surface);
            border: 1px solid var(--border);

        .com-type-menu.hidden { display: none; }

        .com-type-opt {
            display: flex; align-items: center; gap: 6px;
            padding: 8px 12px;
            font-size: 12px; font-weight: 600;
            color: var(--text-secondary);
            border-radius: 8px;
            cursor: pointer;
            border: none; background: none; font-family: inherit;
            transition: background .15s;
            white-space: nowrap;
        }
        .com-type-opt:hover { background: rgba(var(--accent-rgb), 0.06); color: var(--text); }
        .com-type-opt svg { width: 13px; height: 13px; }

        /* Login wall */
        .com-login-wall {
            display: flex; flex-direction: column; align-items: center;
            gap: 0.8rem; padding: 3rem 1.5rem;
            text-align: center;
        }
        .com-login-wall svg { width: 36px; height: 36px; color: var(--text-muted); opacity: 0.4; }
        .com-login-wall p { font-size: 13px; color: var(--text-secondary); line-height: 1.5; }
        .com-login-wall button {
            padding: 8px 20px;

            font-family: inherit; transition: all .2s;
        }
        .com-login-wall button:hover { background: rgba(var(--accent-rgb), 0.14); color: var(--text); }

        /* Feed empty */
        .com-feed-empty {
            display: flex; flex-direction: column; align-items: center;
            gap: 0.6rem; padding: 2.5rem 1rem;
            color: var(--text-muted); text-align: center;
        }
        .com-feed-empty svg { width: 36px; height: 36px; opacity: 0.18; }
        .com-feed-empty p { font-size: 12px; max-width: 200px; line-height: 1.5; }

        /* spin for loaders */
        @keyframes spin { to { transform: rotate(360deg); } }

</style>
