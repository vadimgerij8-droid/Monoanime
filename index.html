        }
        .logo-text h1 {
            font-size: 1.25rem;
            font-weight: 800;
            letter-spacing: 0.02em;
            line-height: 1.1;
            color: #ffffff !important;
        }
        .logo-text span {
            font-size: 0.7rem;
            opacity: 0.85;
            color: #ffffff !important;
            display: block;
            line-height: 1.2;
        }
        /* Hide clock */
        .agnative-topnav-clock {
            display: none !important;
        }

        /* ===== Header layout — burger + title + search в одному рядку ===== */
        .header-left {
            display: flex;
            align-items: center;
            gap: 0.6rem;
            flex: 1;
            min-width: 0;
        }
        .header-actions {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            flex-shrink: 0;
        }
        .header {
            align-items: center !important;
        }

        /* ===== Burger + Search buttons — glassmorphism blur ===== */
        .burger-btn,
        .search-circle-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 46px;
            height: 46px;
            border-radius: 50%;
            background: rgba(255,255,255,0.12) !important;
            backdrop-filter: blur(18px) saturate(140%) !important;
            -webkit-backdrop-filter: blur(18px) saturate(140%) !important;
            border: 1px solid rgba(255,255,255,0.18) !important;
            color: #ffffff !important;
            cursor: pointer;
            font-size: 1rem;
            transition: background 0.25s ease, box-shadow 0.25s ease, transform 0.2s ease;
            box-shadow: none;
            flex-shrink: 0;
        }
        body:not(.dark-mode) .burger-btn,
        body:not(.dark-mode) .search-circle-btn {
            color: #ffffff !important;
        }
        .burger-btn:hover,
        .search-circle-btn:hover {
            background: rgba(255,255,255,0.22) !important;
            box-shadow: 0 4px 20px rgba(0,0,0,0.25);
            transform: scale(1.06);
        }
        .burger-btn i,
        .search-circle-btn i {
            color: #ffffff !important;
        }

        /* ====================================================================
           BOTTOM NAV BAR
           ==================================================================== */
        .bottom-nav {
            position: fixed;
            bottom: 16px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1000;
            width: calc(100% - 32px);
            max-width: 420px;
            background: rgba(255, 255, 255, 0.72);
            border: 1px solid rgba(255, 255, 255, 0.55);
            border-radius: 26px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.10), 0 2px 8px rgba(0,0,0,0.06);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 8px 10px;
            backdrop-filter: blur(24px) saturate(180%);
            -webkit-backdrop-filter: blur(24px) saturate(180%);
            transition: transform 0.3s cubic-bezier(.2,.9,.2,1), opacity 0.3s;
        }
        .dark-mode .bottom-nav {
            background: rgba(18, 18, 18, 0.72);
            border-color: rgba(255,255,255,0.08);
        }
        .bottom-nav.hidden-nav {
            transform: translateX(-50%) translateY(120%);
            opacity: 0;
            pointer-events: none;
        }
        .bn-item {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            border: none;
            background: none;
            padding: 0;
            position: relative;
            transition: transform 0.15s;
        }
        .bn-item:active {
            transform: scale(0.92);
        }
        .bn-pill {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            padding: 8px 10px;
            border-radius: 50px;
            transition: background 0.22s cubic-bezier(.2,.9,.2,1), padding 0.22s cubic-bezier(.2,.9,.2,1), color 0.22s;
            color: var(--text-muted);
            font-size: 14px;
            font-weight: 600;
            letter-spacing: -0.01em;
            white-space: nowrap;
        }
        .bn-item.active .bn-pill {
            box-shadow: 0 2px 12px rgba(var(--accent-rgb), 0.3);
            background: var(--text);
            color: var(--bg);
            padding: 10px 18px;
        }
        .bn-pill svg {
            width: 22px;
            height: 22px;
            stroke: currentColor;
            fill: none;
            stroke-width: 1.7;
            stroke-linecap: round;
            stroke-linejoin: round;
            flex-shrink: 0;
            transition: stroke 0.22s;
        }
        .bn-label {
            font-size: 13.5px;
            font-weight: 600;
            display: none;
        }
        .bn-item.active .bn-label {
            display: inline;
        }
        @media (min-width: 900px) {
            .bottom-nav { display: none; }
        }
        @supports (padding-bottom: env(safe-area-inset-bottom)) {
            .bottom-nav {
                bottom: calc(12px + env(safe-area-inset-bottom));
            }
        }
        .app-container { padding-bottom: 90px !important; }
        /* Коли суспільне активне — прибираємо padding, чат займає весь екран */
        body.community-active .app-container { padding-bottom: 0 !important; }
        body.community-active #ratingPageContainer { padding: 0 !important; }

        /* ═══════════════════════════════════════════════════════
           RATING & COMMUNITY — v4 Black & White + Blur + Media
           ═══════════════════════════════════════════════════════ */

        #ratingPageContainer {
            display: none;
            min-height: 100vh;
            padding: 0;
            animation: fadeInUp 0.32s cubic-bezier(.2,.9,.2,1) both;
        }
        #ratingPageContainer.active { display: block; }

        /* ── Full-screen tabs (glass pill, no nav) ── */
        .rg-main-tabs {
            display: flex;
            gap: 4px;
            padding: 5px;
            background: var(--glass);
            backdrop-filter: blur(24px) saturate(1.4);
            -webkit-backdrop-filter: blur(24px) saturate(1.4);
            border-radius: 16px;
            border: 1px solid var(--border);
            box-shadow: var(--shadow-sm);
            margin: 0.6rem 1rem;
            position: sticky;
            top: 0;
            z-index: 50;
        }
        .rg-main-tab {
            flex: 1;
            padding: 11px 6px;
            border-radius: 12px;
            font-size: 13px;
            font-weight: 700;
            text-align: center;
            cursor: pointer;
            color: var(--text-muted);
            transition: all .3s cubic-bezier(.2,.9,.2,1);
            border: none;
            background: none;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 7px;
            font-family: inherit;
            min-height: 46px;
            letter-spacing: 0.01em;
            position: relative;
            overflow: hidden;
        }
        .rg-main-tab svg { width: 17px; height: 17px; flex-shrink: 0; }
        .rg-main-tab:hover { color: var(--text-secondary); }
        .rg-main-tab.active {
            background: var(--accent);
            color: var(--accent-text);
            box-shadow: 0 4px 16px rgba(var(--accent-rgb), 0.25);
        }

        .rg-tab-panel { display: none; animation: fadeInUp 0.3s ease; }
        .rg-tab-panel.active { display: block; }

        /* ══════════════ RATING PANEL ══════════════ */

        .rg-my-stats {
            margin: 0.8rem 1rem 0;
            background: var(--glass);
            backdrop-filter: blur(28px) saturate(1.5);
            -webkit-backdrop-filter: blur(28px) saturate(1.5);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            padding: 1.3rem;
            box-shadow: var(--shadow-sm);
            position: relative;
            overflow: hidden;
        }
        .rg-my-stats::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--border-hover), transparent);
        }
        .rg-stats-top {
            display: flex;
            align-items: center;
            gap: 1rem;
            margin-bottom: 1.1rem;
        }
        .rg-stats-avatar {
            width: 56px; height: 56px;
            border-radius: 50%;
            overflow: hidden;
            border: 2px solid var(--border);
            flex-shrink: 0;
            display: flex; align-items: center; justify-content: center;
            font-size: 1.3rem; font-weight: 700;
            background: var(--tag-bg);
            color: var(--text-secondary);
            box-shadow: 0 2px 10px rgba(var(--accent-rgb), 0.08);
        }
        .rg-stats-avatar img { width:100%; height:100%; object-fit:cover; filter: grayscale(40%) contrast(1.05); }
        .rg-stats-avatar img.is-gif { filter: none; }
        .rg-stats-name {
            font-size: 17px; font-weight: 700;
            color: var(--text);
            letter-spacing: -0.3px;
        }
        .rg-stats-rank-badge {
            display: inline-flex; align-items: center; gap: 5px;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 10px; font-weight: 700;
            color: var(--accent-text);
            background: var(--accent);
            margin-top: 6px;
            letter-spacing: 0.3px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        .rg-stats-rank-badge svg { width: 11px; height: 11px; }
        .rg-stats-grid {
            display: flex; gap: 8px;
        }
        .rg-stat-cell {
            flex: 1;
            background: rgba(var(--accent-rgb), 0.03);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            padding: 14px 8px;
            text-align: center;
            transition: all .3s cubic-bezier(.2,.9,.2,1);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
        }
        .rg-stat-cell:hover {
            background: rgba(var(--accent-rgb), 0.06);
            border-color: var(--border-hover);
            transform: translateY(-2px);
            box-shadow: 0 4px 14px rgba(var(--accent-rgb), 0.06);
        }
        .rg-stat-val {
            font-size: 22px; font-weight: 800;
            color: var(--text);
            letter-spacing: -0.5px;
        }
        .rg-stat-label {
            font-size: 9px; font-weight: 600;
            text-transform: uppercase; letter-spacing: 1.2px;
            color: var(--text-muted); margin-top: 4px;
        }

        /* Achievements */
        .rg-achievements { margin: 1rem 1rem 0; }
        .rg-section-label {
            font-size: 11px; font-weight: 700;
            text-transform: uppercase; letter-spacing: 1.5px;
            color: var(--text-secondary);
            padding: 0 2px 0.6rem;
        }
        .rg-ach-scroll {
            display: flex; gap: 0.55rem;
            overflow-x: auto;
            padding-bottom: 0.4rem;
            scrollbar-width: none;
        }
        .rg-ach-scroll::-webkit-scrollbar { display: none; }
        .rg-ach-item {
            flex-shrink: 0;
            display: flex; flex-direction: column; align-items: center;
            gap: 0.4rem;
            padding: 0.75rem 0.8rem;
            border-radius: var(--radius-sm);
            border: 1px solid var(--border);
            background: var(--glass);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            min-width: 76px;
            text-align: center;
            transition: all .3s cubic-bezier(.2,.9,.2,1);
        }
        .rg-ach-item.earned {
            border-color: rgba(var(--accent-rgb), 0.3);
            background: rgba(var(--accent-rgb), 0.04);
            box-shadow: 0 2px 12px rgba(var(--accent-rgb), 0.06);
        }
        .rg-ach-item.earned:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 18px rgba(var(--accent-rgb), 0.1);
        }
        .rg-ach-item.locked { opacity: 0.3; filter: grayscale(100%); }
        .rg-ach-icon { width: 26px; height: 26px; display: flex; align-items: center; justify-content: center; }
        .rg-ach-icon svg { width: 24px; height: 24px; }
        .rg-ach-name {
            font-size: 10px; font-weight: 700;
            color: var(--text); line-height: 1.2;
        }
        .rg-ach-req { font-size: 9px; color: var(--text-muted); }

        /* Sort tabs */
        .rg-sort-tabs {
            display: flex; gap: 0.4rem;
            padding: 1rem 1rem 0.5rem;
            overflow-x: auto; scrollbar-width: none;
        }
        .rg-sort-tabs::-webkit-scrollbar { display: none; }
        .rg-sort-tab {
            flex-shrink: 0;
            padding: 7px 16px;
            font-size: 11px; font-weight: 600;
            letter-spacing: 0.5px;
            color: var(--text-muted);
            background: var(--glass);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--border);
            border-radius: 20px;
            cursor: pointer;
            transition: all .3s cubic-bezier(.2,.9,.2,1);
            font-family: inherit;
            white-space: nowrap;
        }
        .rg-sort-tab:hover { border-color: var(--border-hover); color: var(--text-secondary); }
        .rg-sort-tab.active {
            color: var(--accent-text);
            border-color: var(--accent);
            background: var(--accent);
            box-shadow: 0 2px 10px rgba(var(--accent-rgb), 0.2);
        }

        .rg-lb-title {
            padding: 0 1rem 0.5rem;
            font-size: 11px; font-weight: 700;
            letter-spacing: 1.5px; text-transform: uppercase;
            color: var(--text-secondary);
        }

        /* Podium */
        .rg-podium {
            display: flex; align-items: flex-end; justify-content: center;
            gap: 0.6rem; padding: 0.5rem 1rem 0.3rem;
        }
        .rg-podium-item {
            flex: 1; max-width: 100px;
            display: flex; flex-direction: column; align-items: center; gap: 0.35rem;
            animation: floatIn 0.4s ease both;
        }
        .rg-podium-crown { width: 24px; height: 24px; display: flex; align-items: center; justify-content: center; }
        .rg-podium-crown svg { width: 100%; height: 100%; }
        .rg-podium-item.p1 .rg-podium-crown { width: 32px; height: 32px; }
        .rg-podium-item.p1 .rg-podium-crown svg { width: 100%; height: 100%; }
        .rg-podium-avatar {
            width: 50px; height: 50px; border-radius: 50%;
            overflow: hidden; border: 2px solid var(--border);
            display: flex; align-items: center; justify-content: center;
            font-size: 1.1rem; font-weight: 700;
            background: var(--tag-bg); color: var(--text-secondary);
            transition: transform .3s;
        }
        .rg-podium-item:hover .rg-podium-avatar { transform: scale(1.05); }
        .rg-podium-item.p1 .rg-podium-avatar { width: 68px; height: 68px; border-width: 3px; border-color: var(--text); }
        .rg-podium-item.p2 .rg-podium-avatar { border-color: var(--text-muted); }
        .rg-podium-item.p3 .rg-podium-avatar { border-color: var(--border-hover); }
        .rg-podium-avatar img { width:100%; height:100%; object-fit:cover; filter: grayscale(50%); }
        .rg-podium-avatar img.is-gif { filter: none; }
        .rg-podium-name {
            font-size: 11px; font-weight: 700; color: var(--text);
            text-align: center; line-height: 1.2;
        }
        .rg-podium-score {
            font-size: 13px; font-weight: 800; color: var(--text);
        }
        .rg-podium-score .unit { font-size: 10px; font-weight: 500; color: var(--text-muted); margin-left: 2px; }
        .rg-podium-bar {
            width: 100%; border-radius: 8px 8px 0 0;
            background: var(--glass);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--border);
            border-bottom: none;
            display: flex; align-items: center; justify-content: center;
            font-size: 14px; font-weight: 900; color: var(--text);
        }
        .rg-podium-item.p1 .rg-podium-bar { height: 52px; background: rgba(var(--accent-rgb), 0.08); }
        .rg-podium-item.p2 .rg-podium-bar { height: 38px; }
        .rg-podium-item.p3 .rg-podium-bar { height: 28px; }

        /* Leaderboard list */
        .rg-lb-list { padding: 0.4rem 1rem 0.5rem; display: flex; flex-direction: column; gap: 7px; }
        .rg-lb-item {
            display: flex; align-items: center; gap: 0.7rem;
            padding: 10px 12px;
            background: var(--glass);
            backdrop-filter: blur(20px) saturate(1.3);
            -webkit-backdrop-filter: blur(20px) saturate(1.3);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            transition: all .3s cubic-bezier(.2,.9,.2,1);
        }
        .rg-lb-item:hover {
            border-color: var(--border-hover);
            transform: translateX(3px);
            box-shadow: var(--shadow-sm);
        }
        .rg-lb-item.is-me {
            border-color: rgba(var(--accent-rgb), 0.3);
            background: rgba(var(--accent-rgb), 0.04);
        }
        .rg-lb-num {
            font-size: 13px; font-weight: 800; color: var(--text-muted);
            min-width: 22px; text-align: center;
        }
        .rg-lb-avatar {
            width: 34px; height: 34px; border-radius: 50%;
            overflow: hidden; flex-shrink: 0;
            display: flex; align-items: center; justify-content: center;
            font-size: 0.78rem; font-weight: 700;
            background: var(--tag-bg); color: var(--text-secondary);
            border: 1px solid var(--border);
        }
        .rg-lb-avatar img { width:100%; height:100%; object-fit:cover; filter: grayscale(50%); }
        .rg-lb-avatar img.is-gif { filter: none; }
        .rg-lb-info { flex: 1; min-width: 0; }
        .rg-lb-name {
            font-size: 13px; font-weight: 700; color: var(--text);
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }
        .rg-lb-rank { font-size: 10px; font-weight: 600; margin-top: 1px; color: var(--text-muted); }
        .rg-lb-score {
            font-size: 16px; font-weight: 800; color: var(--text);
            white-space: nowrap;
        }
        .rg-lb-score .unit { font-size: 10px; font-weight: 500; color: var(--text-muted); margin-left: 2px; }
        .rg-daily-wrap { margin: 14px 0; }
        .rg-daily-header { display:flex; justify-content:space-between; align-items:center; font-size:13px; font-weight:700; color:var(--text); margin-bottom:8px; padding: 0 2px; }
        .rg-daily-count { font-size:11px; font-weight:700; color:var(--accent); background:rgba(128,128,128,.12); padding:2px 8px; border-radius:10px; }
        .dt-list { display:flex; flex-direction:column; gap:8px; }
        .dt-item { display:flex; gap:10px; align-items:flex-start; padding:10px 12px; border-radius:12px; background:var(--card-bg, rgba(128,128,128,.06)); border:1px solid var(--border, rgba(128,128,128,.12)); transition: opacity .2s; }
        .dt-item.done { opacity:.55; }
        .dt-check { width:20px; height:20px; border-radius:50%; border:2px solid var(--border, rgba(128,128,128,.3)); flex-shrink:0; display:flex; align-items:center; justify-content:center; margin-top:2px; }
        .dt-item.done .dt-check { background: var(--accent); border-color: var(--accent); color:#fff; }
        .dt-check svg { width:12px; height:12px; }
        .dt-body { flex:1; min-width:0; }
        .dt-desc { font-size:12.5px; font-weight:600; color:var(--text); margin-bottom:5px; }
        .dt-bar-wrap { height:5px; border-radius:3px; background:rgba(128,128,128,.15); overflow:hidden; margin-bottom:4px; }
        .dt-bar { height:100%; background:var(--accent); border-radius:3px; transition:width .3s; }
        .dt-meta { display:flex; justify-content:space-between; font-size:10.5px; color:var(--text-muted); }
        .dt-xp { color:var(--accent); font-weight:700; }
        .rg-lb-loader {
            display: flex; align-items: center; justify-content: center;
            padding: 2rem;
        }
        .rg-lb-content { display: block; }
        .rg-lb-empty {
            display: flex; flex-direction: column; align-items: center;
            gap: 0.8rem; padding: 2.5rem 1rem;
            color: var(--text-muted); text-align: center;
        }
        .rg-lb-empty svg { width: 40px; height: 40px; opacity: 0.15; }
        .rg-lb-empty p { font-size: 12.5px; max-width: 220px; line-height: 1.5; color: var(--text-muted); }

        /* ══════════════ COMMUNITY CHAT ══════════════ */

        .com-chat-wrap {
            display: flex;
            flex-direction: column;
            height: 100dvh;
            min-height: 100dvh;
            position: relative;
        }
        @supports not (height: 100dvh) {
            .com-chat-wrap { height: 100vh; min-height: 100vh; }
        }

        .com-messages {
            flex: 1;
            overflow-y: auto;
            overflow-x: hidden;
            padding: 1rem 0.9rem 0.5rem;
            display: flex;
            flex-direction: column;
            gap: 4px;
            scrollbar-width: thin;
            scrollbar-color: var(--border) transparent;
            overscroll-behavior: contain;
            -webkit-overflow-scrolling: touch;
        }
        .com-messages::-webkit-scrollbar { width: 4px; }
        .com-messages::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }
        .com-messages::-webkit-scrollbar-track { background: transparent; }

        /* Date separator */
        .com-date-sep {
            display: flex; align-items: center; gap: 0.7rem;
            padding: 0.6rem 0;
        }
        .com-date-sep::before, .com-date-sep::after {
            content: ''; flex: 1; height: 1px; background: var(--border);
        }
        .com-date-sep-text {
            font-size: 10px; font-weight: 600; letter-spacing: 0.5px;
            color: var(--text-muted); white-space: nowrap;
            padding: 3px 10px;
            background: var(--glass);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--border);
            border-radius: 20px;
        }

        /* Message bubble */
        .com-msg {
            display: flex;
            gap: 0.5rem;
            align-items: flex-end;
            max-width: 84%;
            animation: fadeInUp 0.2s ease;
        }
        .com-msg.mine {
            align-self: flex-end;
            flex-direction: row-reverse;
        }
        .com-msg-avatar {
            width: 30px; height: 30px; border-radius: 50%;
            overflow: hidden; flex-shrink: 0;
            display: flex; align-items: center; justify-content: center;
            font-size: 0.72rem; font-weight: 700;
            background: var(--tag-bg); color: var(--text-secondary);
            border: 1px solid var(--border);
            align-self: flex-end;
        }
        .com-msg-avatar img { width:100%; height:100%; object-fit:cover; filter: grayscale(50%); }
        .com-msg-avatar img.is-gif { filter: none; }
        .com-msg.mine .com-msg-avatar { display: none; }

        .com-msg-col { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
        .com-msg.mine .com-msg-col { align-items: flex-end; }

        .com-msg-name {
            font-size: 10px; font-weight: 700;
            color: var(--text-secondary);
            padding: 0 4px;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
            letter-spacing: -0.1px;
        }
        .com-msg.mine .com-msg-name { display: none; }

        .com-msg-bubble {
            padding: 9px 13px;
            border-radius: 18px;
            font-size: 13.5px; line-height: 1.55;
            word-break: break-word; color: var(--text);
            background: var(--glass);
            backdrop-filter: blur(24px) saturate(1.4);
            -webkit-backdrop-filter: blur(24px) saturate(1.4);
            border: 1px solid var(--border);
            position: relative;
            max-width: 100%;
        }
        .com-msg.mine .com-msg-bubble {
            background: rgba(var(--accent-rgb), 0.1);
            border-color: rgba(var(--accent-rgb), 0.2);
            border-bottom-right-radius: 5px;
        }
        .com-msg:not(.mine) .com-msg-bubble { border-bottom-left-radius: 5px; }

        /* type badge */
        .com-msg-type {
            display: inline-flex; align-items: center; gap: 4px;
            font-size: 9px; font-weight: 700; letter-spacing: 0.5px;
            text-transform: uppercase; color: var(--text-muted);
            margin-bottom: 5px;
        }
        .com-msg-type svg { width: 10px; height: 10px; }

        /* Media in message */
        .com-msg-media {
            margin: 6px 0 2px;
            border-radius: 12px;
            overflow: hidden;
            max-width: 240px;
            border: 1px solid var(--border);
        }
        .com-msg-media img {
            width: 100%; display: block;
            filter: grayscale(30%);
        }
        .com-msg-media video {
            width: 100%; display: block;
            border-radius: 12px;
        }

        /* Text watermark */
        .com-msg-watermark {
            font-size: 8px;
            font-weight: 500;
            color: var(--text-muted);
            opacity: 0.5;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            padding: 2px 6px 0;
            text-align: right;
            white-space: nowrap;
        }
        .com-msg.mine .com-msg-watermark { text-align: right; }

        .com-msg-time {
            font-size: 9px; color: var(--text-muted);
            padding: 0 4px;
            align-self: flex-end;
        }

        /* Input area */
        .com-input-wrap {
            display: flex;
            align-items: flex-end;
            gap: 0.5rem;
            padding: 0.7rem 0.9rem;
            padding-bottom: calc(0.7rem + env(safe-area-inset-bottom, 0px));
            border-top: 1px solid var(--border);
            background: var(--glass);
            backdrop-filter: blur(28px) saturate(1.5);
            -webkit-backdrop-filter: blur(28px) saturate(1.5);
            flex-shrink: 0;
            position: relative;
        }

        /* Media preview */
        .com-media-preview {
            display: none;
            align-items: center;
            gap: 0.4rem;
            padding: 0.4rem 0.7rem 0;
            flex-wrap: wrap;
        }
        .com-media-preview.active { display: flex; }
        .com-media-thumb {
            position: relative;
            width: 54px; height: 54px;
            border-radius: 10px;
            overflow: hidden;
            border: 1px solid var(--border);
        }
        .com-media-thumb img,
        .com-media-thumb video {
            width: 100%; height: 100%; object-fit: cover;
            filter: grayscale(30%);
        }
        .com-media-remove {
            position: absolute;
            top: 2px; right: 2px;
            width: 18px; height: 18px;
            border-radius: 50%;
            background: rgba(0,0,0,0.6);
            border: none;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer;
            color: #fff;
            padding: 0;
        }
        .com-media-remove svg { width: 10px; height: 10px; }

        .com-input-box {
            flex: 1;
            display: flex;
            align-items: flex-end;
            gap: 0;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 22px;
            padding: 7px 12px 7px 14px;
            transition: all .3s cubic-bezier(.2,.9,.2,1);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
        }
        .com-input-box:focus-within {
            border-color: rgba(var(--accent-rgb), 0.4);
            box-shadow: 0 0 0 3px rgba(var(--accent-rgb), 0.06);
        }
        .com-input-box textarea {
            flex: 1; background: transparent;
            border: none; outline: none; resize: none;
            color: var(--text); font-size: 13.5px;
            font-family: inherit; min-height: 22px; max-height: 110px;
            line-height: 1.5; padding: 2px 0;
        }
        .com-input-box textarea::placeholder { color: var(--text-muted); }

        /* Attach button (photo/video) */
        .com-attach-btn {
            flex-shrink: 0;
            width: 28px; height: 28px;
            display: flex; align-items: center; justify-content: center;
            background: none; border: none; cursor: pointer;
            color: var(--text-muted); transition: color .2s;
            align-self: flex-end; margin-bottom: 2px;
            border-radius: 50%;
        }
        .com-attach-btn:hover { color: var(--text-secondary); background: rgba(var(--accent-rgb), 0.06); }
        .com-attach-btn svg { width: 18px; height: 18px; }

        /* Type selector button */
        .com-type-btn {
            flex-shrink: 0;
            width: 28px; height: 28px;
            display: flex; align-items: center; justify-content: center;
            background: none; border: none; cursor: pointer;
            color: var(--text-muted); transition: color .2s;
            align-self: flex-end; margin-bottom: 2px;
            border-radius: 50%;
        }
        .com-type-btn:hover { color: var(--text-secondary); background: rgba(var(--accent-rgb), 0.06); }
        .com-type-btn svg { width: 17px; height: 17px; }
        .com-type-btn.active { color: var(--accent); }

        .com-send-btn {
            flex-shrink: 0;
            width: 42px; height: 42px;
            border-radius: 50%;
            background: var(--accent);
            border: none;
            color: var(--accent-text);
            display: flex; align-items: center; justify-content: center;
            cursor: pointer;
            transition: all .3s cubic-bezier(.2,.9,.2,1);
            box-shadow: 0 2px 12px rgba(var(--accent-rgb), 0.25);
        }
        .com-send-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 4px 18px rgba(var(--accent-rgb), 0.35);
        }
        .com-send-btn:active { transform: scale(0.95); }
        .com-send-btn:disabled { opacity: 0.35; cursor: default; transform: none; box-shadow: none; }
        .com-send-btn svg { width: 17px; height: 17px; }

        /* Type menu popup */
        .com-type-menu {
            position: absolute;
            bottom: calc(100% + 8px);
            left: 0.9rem;
            background: var(--glass);
            backdrop-filter: blur(28px) saturate(1.5);
            -webkit-backdrop-filter: blur(28px) saturate(1.5);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 5px;
            display: flex; gap: 3px;
            z-index: 20;
            box-shadow: var(--shadow-md);
            animation: fadeInUp 0.2s ease;
        }
        .com-type-menu.hidden { display: none; }

        .com-type-opt {
            display: flex; align-items: center; gap: 6px;
            padding: 8px 12px;
            font-size: 12px; font-weight: 600;
            color: var(--text-secondary);
            background: none; border: none;
            border-radius: 10px;
            cursor: pointer; transition: all .2s;
            font-family: inherit;
            white-space: nowrap;
        }
        .com-type-opt:hover { background: rgba(var(--accent-rgb), 0.06); color: var(--text); }
        .com-type-opt svg { width: 15px; height: 15px; }

        /* Filter tabs: Думка / Рекомендація / Досягнення */
        .com-filter-tabs {
            display: flex; gap: 0.4rem;
            padding: 0.7rem 0.9rem 0.6rem;
            border-bottom: 1px solid var(--border);
            flex-shrink: 0;
            overflow-x: auto; scrollbar-width: none;
        }
        .com-filter-tabs::-webkit-scrollbar { display: none; }
        .com-filter-tab {
            flex-shrink: 0;
            padding: 7px 16px;
            font-size: 11.5px; font-weight: 700;
            letter-spacing: 0.3px;
            color: var(--text-muted);
            background: var(--glass);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--border);
            border-radius: 20px;
            cursor: pointer;
            transition: all .3s cubic-bezier(.2,.9,.2,1);
            font-family: inherit;
            white-space: nowrap;
        }
        .com-filter-tab:hover { border-color: var(--border-hover); color: var(--text-secondary); }
        .com-filter-tab.active {
            color: var(--accent-text);
            border-color: var(--accent);
            background: var(--accent);
            box-shadow: 0 2px 10px rgba(var(--accent-rgb), 0.2);
        }

        /* Message action buttons (edit/delete) */
        .com-msg-actions { display: flex; gap: 4px; margin: 2px 4px 0; }
        .com-msg.mine .com-msg-actions { justify-content: flex-end; }
        .com-msg-action-btn {
            width: 20px; height: 20px;
            display: flex; align-items: center; justify-content: center;
            background: none; border: none; cursor: pointer;
            color: var(--text-muted); opacity: 0.6;
            transition: all .2s; padding: 0; border-radius: 50%;
        }
        .com-msg-action-btn:hover { opacity: 1; color: var(--text-secondary); background: rgba(var(--accent-rgb), 0.08); }
        .com-msg-action-btn svg { width: 12px; height: 12px; }
        .com-msg-edited-tag { font-size: 8.5px; color: var(--text-muted); opacity: 0.6; margin-left: 4px; }

        /* Inline edit box */
        .com-msg-edit-box { display: flex; flex-direction: column; gap: 6px; min-width: 180px; }
        .com-msg-edit-box textarea {
            background: var(--surface); border: 1px solid var(--border);
            border-radius: 10px; padding: 7px 10px; color: var(--text);
            font-size: 13px; font-family: inherit; resize: none; min-height: 40px;
            outline: none; width: 100%;
        }
        .com-msg-edit-box textarea:focus { border-color: rgba(var(--accent-rgb), 0.4); }
        .com-msg-edit-actions { display: flex; gap: 6px; justify-content: flex-end; }
        .com-msg-edit-actions button {
            font-size: 11px; font-weight: 700; padding: 5px 12px;
            border-radius: 14px; border: 1px solid var(--border); cursor: pointer;
            font-family: inherit; background: var(--glass); color: var(--text-secondary);
        }
        .com-msg-edit-save { background: var(--accent) !important; color: var(--accent-text) !important; border-color: var(--accent) !important; }

        /* Compose extra panel (anime / achievement picker) */
        .com-compose-extra:empty { display: none; }
        .com-compose-extra { padding: 0 0.9rem 0.5rem; }

        .com-anime-search input, .com-ach-picker input {
            width: 100%; background: var(--surface); border: 1px solid var(--border);
            border-radius: 18px; padding: 8px 14px; color: var(--text);
            font-size: 13px; font-family: inherit; outline: none; margin-bottom: 6px;
            box-sizing: border-box;
        }
        .com-anime-results {
            display: flex; flex-direction: column; gap: 4px;
            max-height: 180px; overflow-y: auto; margin-bottom: 4px;
        }
        .com-anime-result-item {
            display: flex; align-items: center; gap: 8px;
            padding: 6px 8px; border-radius: 10px; cursor: pointer;
            background: var(--glass); border: 1px solid var(--border);
            transition: all .2s;
        }
        .com-anime-result-item:hover { border-color: var(--border-hover); background: rgba(var(--accent-rgb), 0.06); }
        .com-anime-result-item img { width: 30px; height: 42px; object-fit: cover; border-radius: 6px; flex-shrink: 0; }
        .com-anime-result-item span { font-size: 12.5px; font-weight: 600; color: var(--text); }

        .com-anime-selected, .com-ach-selected {
            display: flex; align-items: center; gap: 10px;
            padding: 8px 10px; margin-bottom: 6px;
            border-radius: 14px; background: rgba(var(--accent-rgb), 0.06);
            border: 1px solid rgba(var(--accent-rgb), 0.2);
        }
        .com-anime-selected img { width: 38px; height: 54px; object-fit: cover; border-radius: 8px; flex-shrink: 0; }
        .com-anime-selected-info, .com-ach-selected-info { flex: 1; min-width: 0; }
        .com-anime-selected-title, .com-ach-selected-name { font-size: 12.5px; font-weight: 700; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .com-anime-selected-desc, .com-ach-selected-req {
            font-size: 11px; color: var(--text-muted); margin-top: 2px;
            overflow: hidden; text-overflow: ellipsis;
            display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
        }
        .com-anime-clear, .com-ach-clear {
            flex-shrink: 0; width: 22px; height: 22px; border-radius: 50%;
            background: none; border: 1px solid var(--border); cursor: pointer;
            color: var(--text-muted); font-size: 14px; line-height: 1;
            display: flex; align-items: center; justify-content: center;
        }
        .com-ach-selected-icon { width: 26px; height: 26px; display: flex; align-items: center; justify-content: center; color: var(--accent); flex-shrink: 0; }
        .com-ach-selected-icon svg { width: 22px; height: 22px; }

        .com-ach-grid {
            display: grid; grid-template-columns: repeat(auto-fill, minmax(88px, 1fr));
            gap: 6px; max-height: 180px; overflow-y: auto; margin-bottom: 4px;
        }
        .com-ach-opt {
            display: flex; flex-direction: column; align-items: center; gap: 4px;
            padding: 8px 4px; border-radius: 12px; cursor: pointer;
            background: var(--glass); border: 1px solid var(--border);
            font-family: inherit; transition: all .2s;
        }
        .com-ach-opt:hover { border-color: rgba(var(--accent-rgb), 0.4); background: rgba(var(--accent-rgb), 0.06); }
        .com-ach-opt-icon { width: 20px; height: 20px; color: var(--accent); }
        .com-ach-opt-icon svg { width: 18px; height: 18px; }
        .com-ach-opt-name { font-size: 9.5px; font-weight: 700; color: var(--text); text-align: center; line-height: 1.2; }
        .com-ach-empty { font-size: 12px; color: var(--text-muted); padding: 10px 0; text-align: center; }

        /* Rich anime card inside a chat message */
        .com-anime-card {
            display: flex; gap: 9px;
            margin: 6px 0 2px; padding: 8px;
            border-radius: 14px; cursor: pointer;
            background: rgba(var(--accent-rgb), 0.05);
            border: 1px solid rgba(var(--accent-rgb), 0.15);
            transition: all .2s; max-width: 260px;
        }
        .com-anime-card:hover { background: rgba(var(--accent-rgb), 0.1); border-color: rgba(var(--accent-rgb), 0.3); }
        .com-anime-card img { width: 48px; height: 68px; object-fit: cover; border-radius: 8px; flex-shrink: 0; }
        .com-anime-card-info { min-width: 0; }
        .com-anime-card-title { font-size: 13px; font-weight: 800; color: var(--text); margin-bottom: 3px; }
        .com-anime-card-desc {
            font-size: 11px; color: var(--text-muted); line-height: 1.4;
            overflow: hidden; text-overflow: ellipsis;
            display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical;
        }
        .com-anime-card-cta { font-size: 10px; font-weight: 700; color: var(--accent); margin-top: 4px; }

        /* Rich achievement card inside a chat message */
        .com-ach-card {
            display: flex; align-items: center; gap: 10px;
            margin: 6px 0 2px; padding: 9px 12px;
            border-radius: 14px;
            background: rgba(var(--accent-rgb), 0.05);
            border: 1px solid rgba(var(--accent-rgb), 0.15);
        }
        .com-ach-card-icon { width: 30px; height: 30px; display: flex; align-items: center; justify-content: center; color: var(--accent); flex-shrink: 0; }
        .com-ach-card-icon svg { width: 26px; height: 26px; }
        .com-ach-card-name { font-size: 13px; font-weight: 800; color: var(--text); }
        .com-ach-card-req { font-size: 10.5px; color: var(--text-muted); margin-top: 1px; }

        /* Modern chat header (Telegram-like group header) */
        .com-chat-header {
            display: flex; align-items: center; gap: 10px;
            padding: 0.75rem 0.9rem;
            border-bottom: 1px solid var(--border);
            background: linear-gradient(135deg, rgba(var(--accent-rgb),0.08), transparent 60%);
            flex-shrink: 0;
        }
        .com-chat-header-icon {
            width: 38px; height: 38px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-size: 18px;
            background: var(--accent); color: var(--accent-text);
            flex-shrink: 0;
            box-shadow: 0 2px 10px rgba(var(--accent-rgb),0.3);
        }
        .com-chat-header-info { min-width: 0; }
        .com-chat-header-title { font-size: 14px; font-weight: 800; color: var(--text); letter-spacing: -0.2px; }
        .com-chat-header-sub { font-size: 11px; color: var(--text-muted); margin-top: 1px; display: flex; align-items: center; gap: 4px; }
        .com-chat-header-dot { width: 6px; height: 6px; border-radius: 50%; background: #22c55e; display: inline-block; box-shadow: 0 0 0 2px rgba(34,197,94,0.2); }
        .com-chat-header { cursor: pointer; transition: background .2s; }
        .com-chat-header:hover { background: linear-gradient(135deg, rgba(var(--accent-rgb),0.14), transparent 60%); }
        .com-chat-header-chevron { margin-left: auto; color: var(--text-muted); flex-shrink: 0; }
        .com-chat-header-chevron svg { width: 16px; height: 16px; }

        /* ===================================================================
           GROUP MODULE — Telegram-2026-style group info / members / edit
           sheets for the Dumbka/VakDab community. Theme-aware (uses the
           site's light/dark CSS variables, not hardcoded colors).
           =================================================================== */
        .grp-sheet-overlay {
            position: fixed; inset: 0; z-index: 200;
            background: rgba(0,0,0,0.4);
            display: flex; align-items: flex-end; justify-content: center;
            opacity: 0; transition: opacity .25s ease;
        }
        .grp-sheet-overlay.open { opacity: 1; }
        .grp-sheet {
            width: 100%; max-width: 560px;
            max-height: 82vh; overflow-y: auto;
            background: var(--surface);
            backdrop-filter: blur(30px); -webkit-backdrop-filter: blur(30px);
            border: 1px solid var(--border);
            border-bottom: none;
            border-radius: 22px 22px 0 0;
            padding: 0.8rem 1.1rem 1.6rem;
            box-shadow: var(--shadow-lg);
            transform: translateY(16px);
            transition: transform .3s cubic-bezier(.16,1,.3,1);
        }
        .grp-sheet-overlay.open .grp-sheet { transform: translateY(0); }
        .grp-sheet-tall { max-height: 86vh; }
        .grp-sheet-handle {
            width: 36px; height: 4px; border-radius: 99px;
            background: var(--border-hover); margin: 0 auto 0.9rem;
        }

        .grp-info-header { display: flex; flex-direction: column; align-items: center; text-align: center; padding: 0.4rem 0 1.1rem; }
        .grp-info-avatar {
            position: relative;
            width: 84px; height: 84px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-size: 34px;
            background: var(--accent-gradient); color: var(--accent-text);
            margin-bottom: 0.7rem; box-shadow: var(--shadow-md);
            overflow: hidden;
        }
        .grp-info-avatar img { width: 100%; height: 100%; object-fit: cover; }
        .grp-avatar-edit {
            position: absolute; bottom: -2px; right: -2px;
            width: 28px; height: 28px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            background: var(--surface); border: 1px solid var(--border);
            color: var(--text); cursor: pointer; box-shadow: var(--shadow-sm);
        }
        .grp-avatar-edit svg { width: 14px; height: 14px; }
        .grp-info-name { font-size: 1.15rem; font-weight: 800; color: var(--text); }
        .grp-info-desc { font-size: 0.82rem; color: var(--text-muted); margin-top: 0.25rem; max-width: 420px; }
        .grp-info-stats { font-size: 0.78rem; color: var(--text-muted); margin-top: 0.5rem; }

        .grp-action-row {
            width: 100%; display: flex; align-items: center; gap: 0.7rem;
            padding: 0.75rem 0.6rem; border: none; background: none;
            border-top: 1px solid var(--border-light);
            color: var(--text); font-family: inherit; font-size: 0.88rem; font-weight: 600;
            cursor: pointer; text-align: left;
        }
        .grp-action-row:hover { background: var(--hover); }
        .grp-action-row svg { width: 19px; height: 19px; color: var(--text-muted); flex-shrink: 0; }
        .grp-action-row-count { margin-left: auto; color: var(--text-muted); font-weight: 600; font-size: 0.8rem; }

        .grp-access-section { padding: 0.8rem 0.6rem 0.2rem; border-top: 1px solid var(--border-light); }
        .grp-access-title { font-size: 0.7rem; font-weight: 700; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.6px; margin-bottom: 0.5rem; }
        .grp-access-toggle { display: flex; gap: 0.4rem; }
        .grp-access-opt {
            flex: 1; padding: 0.5rem 0.6rem; border-radius: 12px;
            border: 1px solid var(--border); background: var(--bg);
            color: var(--text-secondary); font-family: inherit; font-size: 0.78rem; font-weight: 700;
            cursor: pointer; transition: all .2s;
        }
        .grp-access-opt.active { background: var(--accent); color: var(--accent-text); border-color: transparent; }

        .grp-edit-title { font-size: 1rem; font-weight: 800; color: var(--text); margin-bottom: 0.9rem; }
        .grp-field-label { display: block; font-size: 0.72rem; font-weight: 700; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; margin: 0.7rem 0 0.3rem; }
        .grp-field-input {
            width: 100%; padding: 0.6rem 0.8rem; border-radius: 12px;
            border: 1px solid var(--border); background: var(--bg); color: var(--text);
            font-family: inherit; font-size: 0.88rem; resize: none;
        }
        .grp-field-input:focus { outline: none; border-color: var(--accent); }
        .grp-edit-actions { display: flex; gap: 0.6rem; margin-top: 1.2rem; }
        .grp-btn-secondary, .grp-btn-primary {
            flex: 1; padding: 0.65rem; border-radius: 12px; font-weight: 700; font-size: 0.85rem;
            cursor: pointer; font-family: inherit; border: 1px solid var(--border);
        }
        .grp-btn-secondary { background: var(--bg); color: var(--text); }
        .grp-btn-primary { background: var(--accent); color: var(--accent-text); border-color: transparent; }

        .grp-members-list { margin-top: 0.3rem; }
        .grp-member-row {
            display: flex; align-items: center; gap: 0.65rem;
            padding: 0.55rem 0.3rem; border-bottom: 1px solid var(--border-light);
        }
        .grp-member-avatar {
            width: 38px; height: 38px; border-radius: 50%; flex-shrink: 0;
            display: flex; align-items: center; justify-content: center;
            background: var(--accent-gradient); color: var(--accent-text); font-weight: 700; font-size: 0.9rem;
            overflow: hidden;
        }
        .grp-member-avatar img { width: 100%; height: 100%; object-fit: cover; }
        .grp-member-info { min-width: 0; flex: 1; }
        .grp-member-name { font-size: 0.86rem; font-weight: 700; color: var(--text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .grp-banned-tag { font-size: 0.68rem; font-weight: 700; color: #ef4444; }
        .grp-role-badge { font-size: 0.7rem; font-weight: 700; margin-top: 0.1rem; display: inline-block; }
        .grp-role-badge.owner { color: #eab308; }
        .grp-role-badge.admin { color: var(--accent); }
        .grp-member-menu-btn {
            width: 30px; height: 30px; border-radius: 50%; border: none; background: none;
            color: var(--text-muted); font-size: 1.1rem; cursor: pointer; flex-shrink: 0;
        }
        .grp-member-menu-btn:hover { background: var(--hover); }

        .grp-member-ctx {
            position: fixed; z-index: 260; min-width: 180px;
            background: var(--surface); backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px);
            border: 1px solid var(--border); border-radius: 14px;
            box-shadow: var(--shadow-lg); padding: 0.35rem;
            opacity: 0; transform: scale(.95); transition: all .15s ease;
        }
        .grp-member-ctx.show { opacity: 1; transform: scale(1); }
        .grp-member-ctx button {
            display: block; width: 100%; text-align: left; padding: 0.55rem 0.7rem;
            border: none; background: none; border-radius: 10px;
            color: var(--text); font-family: inherit; font-size: 0.82rem; font-weight: 600; cursor: pointer;
        }
        .grp-member-ctx button:hover { background: var(--hover); }
        .grp-member-ctx button.grp-ctx-danger { color: #ef4444; }

        /* Reactions row under a bubble */
        .com-msg-reactions { display: flex; flex-wrap: wrap; gap: 4px; padding: 0 4px; margin-top: 2px; }
        .com-msg.mine .com-msg-reactions { justify-content: flex-end; }
        .com-reaction-pill {
            display: inline-flex; align-items: center; gap: 3px;
            font-size: 11px; padding: 2px 8px;
            border-radius: 12px; cursor: pointer;
            background: rgba(var(--accent-rgb), 0.08);
            border: 1px solid rgba(var(--accent-rgb), 0.18);
            transition: all .2s; font-family: inherit;
        }
        .com-reaction-pill:hover { background: rgba(var(--accent-rgb), 0.16); }
        .com-reaction-pill.mine-reacted { background: rgba(var(--accent-rgb), 0.22); border-color: var(--accent); }
        .com-reaction-pill .cnt { font-weight: 700; color: var(--text-secondary); font-size: 10px; }

        /* Reply quote inside a bubble */
        .com-msg-reply-quote {
            display: flex; flex-direction: column;
            padding: 4px 8px; margin-bottom: 6px;
            border-left: 2.5px solid var(--accent);
            border-radius: 6px;
            background: rgba(var(--accent-rgb), 0.06);
        }
        .com-msg-reply-name { font-size: 10.5px; font-weight: 700; color: var(--accent); }
        .com-msg-reply-text { font-size: 11px; color: var(--text-muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 220px; }

        /* @mentions inside message text */
        .com-mention { color: var(--accent); font-weight: 700; }

        /* Reply banner above composer */
        .com-reply-banner {
            display: flex; align-items: center; gap: 8px;
            padding: 7px 12px; margin: 0 0.9rem;
            border-radius: 12px 12px 0 0;
            background: rgba(var(--accent-rgb), 0.08);
            border: 1px solid rgba(var(--accent-rgb), 0.2);
            border-bottom: none;
        }
        .com-reply-banner-bar { width: 3px; align-self: stretch; border-radius: 2px; background: var(--accent); flex-shrink: 0; }
        .com-reply-banner-info { flex: 1; min-width: 0; }
        .com-reply-banner-info b { display: block; font-size: 11px; color: var(--accent); }
        .com-reply-banner-info span { display: block; font-size: 11px; color: var(--text-muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .com-reply-cancel {
            width: 22px; height: 22px; border-radius: 50%; flex-shrink: 0;
            background: none; border: none; cursor: pointer; color: var(--text-muted);
            font-size: 16px; display: flex; align-items: center; justify-content: center;
        }
        .com-reply-cancel:hover { color: var(--text); }

        /* Mention autocomplete dropdown */
        .com-mention-dropdown {
            position: absolute; bottom: calc(100% + 6px); left: 0.9rem; right: 0.9rem;
            max-height: 160px; overflow-y: auto;
            background: var(--glass); backdrop-filter: blur(28px) saturate(1.5);
            -webkit-backdrop-filter: blur(28px) saturate(1.5);
            border: 1px solid var(--border); border-radius: 14px;
            box-shadow: var(--shadow-md); z-index: 22;
        }
        .com-mention-opt {
            display: flex; align-items: center; gap: 8px;
            padding: 8px 12px; cursor: pointer; font-size: 12.5px; font-weight: 600; color: var(--text);
        }
        .com-mention-opt:hover { background: rgba(var(--accent-rgb), 0.08); }

        /* Telegram-style long-press context menu */
        .com-ctx-overlay {
            position: fixed; inset: 0; z-index: 998;
            background: rgba(0,0,0,0.08);
            backdrop-filter: blur(2px); -webkit-backdrop-filter: blur(2px);
            animation: fadeInUp 0.15s ease;
        }
        .com-ctx-menu {
            position: fixed; z-index: 999;
            min-width: 210px;
            background: var(--glass);
            backdrop-filter: blur(32px) saturate(1.6);
            -webkit-backdrop-filter: blur(32px) saturate(1.6);
            border: 1px solid var(--border);
            border-radius: 18px;
            box-shadow: var(--shadow-md), 0 12px 32px rgba(0,0,0,0.25);
            padding: 8px;
            opacity: 0; transform: scale(0.92);
            transition: all .16s cubic-bezier(.2,.9,.2,1);
        }
        .com-ctx-menu.show { opacity: 1; transform: scale(1); }
        .com-ctx-emojis {
            display: flex; justify-content: space-between;
            padding: 4px 4px 8px; margin-bottom: 6px;
            border-bottom: 1px solid var(--border);
        }
        .com-ctx-emoji-btn {
            width: 32px; height: 32px; font-size: 19px;
            background: none; border: none; cursor: pointer;
            border-radius: 50%; transition: transform .15s;
            display: flex; align-items: center; justify-content: center;
        }
        .com-ctx-emoji-btn:hover { transform: scale(1.25); background: rgba(var(--accent-rgb), 0.08); }
        .com-ctx-actions { display: flex; flex-direction: column; gap: 1px; }
        .com-ctx-action {
            display: flex; align-items: center; gap: 10px;
            padding: 9px 10px; font-size: 13px; font-weight: 600;
            color: var(--text); background: none; border: none;
            border-radius: 10px; cursor: pointer; text-align: left;
            font-family: inherit; transition: background .15s;
        }
        .com-ctx-action:hover { background: rgba(var(--accent-rgb), 0.08); }
        .com-ctx-action svg { width: 16px; height: 16px; flex-shrink: 0; color: var(--text-muted); }
        .com-ctx-action.com-ctx-danger { color: #ef4444; }
        .com-ctx-action.com-ctx-danger svg { color: #ef4444; }

        /* Login wall */
        .com-login-wall {
            display: flex; flex-direction: column; align-items: center;
            gap: 1rem; padding: 3rem 1.5rem;
            text-align: center;
        }
        .com-login-wall svg { width: 42px; height: 42px; color: var(--text-muted); opacity: 0.3; }
        .com-login-wall p { font-size: 13px; color: var(--text-secondary); line-height: 1.6; max-width: 280px; }
        .com-login-wall button {
            padding: 10px 24px;
            font-size: 13px; font-weight: 700;
            background: rgba(var(--accent-rgb), 0.08);
            border: 1px solid var(--border);
            border-radius: 22px;
            color: var(--text-secondary);
            cursor: pointer;
            transition: all .25s;
            font-family: inherit;
        }
        .com-login-wall button:hover { background: rgba(var(--accent-rgb), 0.14); color: var(--text); border-color: var(--border-hover); }

        /* Empty feed */
        .com-feed-empty {
            display: flex; flex-direction: column; align-items: center;
            gap: 0.8rem; padding: 3rem 1rem;
            color: var(--text-muted); text-align: center;
        }
        .com-feed-empty svg { width: 40px; height: 40px; opacity: 0.15; }
        .com-feed-empty p { font-size: 12.5px; max-width: 220px; line-height: 1.5; }

        @keyframes spin { to { transform: rotate(360deg); } }


        /* --- New Comments & UI Style --- */
        .comments-section { margin-top: 24px; padding: 0 16px 20px; }
        .comments-container { display: flex; flex-direction: column; gap: 12px; margin-top: 12px; }
        .comment-item { background: var(--glass); border: 1px solid var(--border); border-radius: var(--radius-md); padding: 12px; backdrop-filter: blur(var(--blur-amount)); animation: fadeInUp 0.4s ease both; }
        .comment-header { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
        .comment-avatar { width: 28px; height: 28px; border-radius: 50%; background: var(--accent); color: var(--accent-text); display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700; }
        .comment-name { font-size: 13px; font-weight: 600; color: var(--text); }
        .comment-time { font-size: 11px; color: var(--text-muted); margin-left: auto; }
        .comment-text { font-size: 13px; line-height: 1.5; color: var(--text-secondary); }
        .comment-input-wrap { margin-top: 16px; display: flex; gap: 8px; }
        .comment-input { flex: 1; background: var(--glass); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 10px 14px; color: var(--text); font-size: 13px; outline: none; transition: border-color 0.2s; }
        .comment-input:focus { border-color: var(--accent); }
        .comment-send { background: var(--accent); color: var(--accent-text); border: none; border-radius: var(--radius-sm); padding: 0 16px; cursor: pointer; font-weight: 600; font-size: 13px; transition: opacity 0.2s; }
        .comment-send:hover { opacity: 0.9; }
        
        .player-play-fab { 
            background: var(--accent) !important; 
            color: var(--accent-text) !important; 
            box-shadow: 0 4px 15px rgba(var(--accent-rgb), 0.4) !important;
        }
        .player-play-fab svg { fill: currentColor; }



    /* ==================================================================
       НОВИЙ СТИЛЬ СТОРІНКИ АНІМЕ — темна кінематографічна подача,
       адаптована під тему сайту (--bg/--text/--accent/--border)
       ================================================================== */
    @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap');

    .player-blur-bg {
        background-color: var(--bg);
    }
    .player-blur-bg::after {
        content: "";
        position: absolute; inset: 0;
        background:
            radial-gradient(220px 320px at 78% 18%, rgba(255,255,255,0.10), transparent 60%),
            radial-gradient(160px 240px at 60% 8%, rgba(255,255,255,0.06), transparent 65%),
            linear-gradient(180deg, rgba(0,0,0,0) 0%, rgba(0,0,0,0.35) 45%, var(--bg) 92%);
    }

    .poster-title {
        font-family: 'Space Grotesk', sans-serif;
        font-size: 22px;
        line-height: 1.25;
        font-weight: 700;
        color: var(--text);
        text-align: center;
        margin-top: 14px;
        text-shadow: 0 2px 18px rgba(0,0,0,0.35);
    }
    .poster-meta {
        display: flex; flex-wrap: wrap; gap: 6px; justify-content: center;
        margin: 10px 0 14px;
    }
    .poster-meta .meta-tag {
        font-size: 11px; font-weight: 600;
        padding: 5px 11px;
        border-radius: 8px;
        border: 1px solid var(--border);
        background: var(--glass, rgba(255,255,255,0.04));
        color: var(--text-secondary);
        white-space: nowrap;
    }
    .poster-meta .meta-tag.age-tag {
        background: var(--accent);
        color: var(--accent-text);
        border-color: transparent;
        font-weight: 700;
    }
    .poster-synopsis {
        font-size: 12.5px;
        line-height: 1.65;
        color: var(--text-secondary);
        text-align: center;
        max-width: 440px;
        margin: 0 auto;
    }

    .comments-section .section-title {
        font-family: 'Space Grotesk', sans-serif;
        font-weight: 600;
        color: var(--text);
    }
    .comment-item {
        transition: transform 0.2s ease;
    }
    .comment-avatar {
        width: 24px; height: 24px; border-radius: 50%;
        background: var(--accent); color: var(--accent-text);
        display: flex; align-items: center; justify-content: center;
        font-size: 11px; font-weight: 700; flex-shrink: 0;
    }
    .comment-header { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
    .comment-name { font-size: 12px; font-weight: 600; color: var(--text); }

    .episode-grid-card, .episode-compact-card, .episode-classic-card {
        position: relative;
        overflow: hidden;
    }
    .episode-grid-badge, .episode-compact-badge, .episode-classic-badge {
        font-family: 'Space Grotesk', sans-serif;
        font-weight: 700;
        text-shadow: 0 2px 10px rgba(0,0,0,0.8);
    }
    .episode-grid-title, .episode-compact-ep-title, .episode-classic-ep-title {
        font-family: 'Space Grotesk', sans-serif;
        color: var(--text);
    }
    .episode-grid-meta .rating, .episode-compact-meta .rating, .episode-classic-meta .rating {
        color: var(--accent);
        font-weight: 600;
    }

    .episode-season-btn {
        font-family: inherit;
    }
    .episode-season-btn.active {
        background: var(--accent);
        color: var(--accent-text);
    }


    /* ==================================================================
       "Кішка, що курить без упину" — референс-дизайн сторінки аніме,
       інтегрований 1:1. Змінні скопійовані з наданого макета, але
       локально заскоуплені під #playerPageModal .modal-content,
       щоб НЕ перетирати глобальну тему сайту (--bg/--text/--accent
       використовуються і в іншому UI).
       ================================================================== */
    @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap');

    #playerPageModal .modal-content{
        --bg:#0a0a0a;
        --panel:rgba(255,255,255,0.06);
        --panel-strong:rgba(255,255,255,0.10);
        --line:rgba(255,255,255,0.12);
        --text:#f2f2f2;
        --text-dim:#9a9a9a;
        --text-dimmer:#6b6b6b;
        --accent:#e5e5e5;
        background:var(--bg);
        color:var(--text);
        font-family:'Inter', sans-serif;
        max-width:520px;
        margin:0 auto;
        position:relative;
        padding-bottom:40px;
        min-height:100%;
    }
    #playerPageModal .modal-content *{ box-sizing:border-box; }

    #playerPageModal .modal-content .display{ font-family:'Space Grotesk', sans-serif; }

    /* ---------- HERO IMAGE BLOCK ---------- */
    #playerPageModal .modal-content .hero-img{
        position:relative;
        height:380px;
        isolation:isolate;
        margin-bottom:-1px;
        background-size:cover;
        background-position:center;
        background-color:#141414;
        filter: grayscale(100%) contrast(1.05);
        transition: filter 0.4s ease;
    }
    #playerPageModal .modal-content .hero-img:hover{
        filter: grayscale(0%) contrast(1);
    }
    #playerPageModal .modal-content .smoke{
        position:absolute; z-index:0; inset:0;
        background:
            radial-gradient(220px 320px at 78% 18%, rgba(255,255,255,0.16), transparent 60%),
            radial-gradient(160px 240px at 60% 8%, rgba(255,255,255,0.10), transparent 65%),
            radial-gradient(300px 200px at 20% 70%, rgba(255,255,255,0.05), transparent 70%);
        filter: blur(18px);
        opacity:0.9;
    }
    #playerPageModal .modal-content .hero-img::after{
        content:"";
        position:absolute; inset:0; z-index:1;
        background:linear-gradient(180deg, rgba(10,10,10,0) 0%, rgba(10,10,10,0.35) 45%, rgba(10,10,10,0.85) 72%, rgba(10,10,10,1) 88%);
    }

    #playerPageModal .modal-content .topbar{
        position:absolute; top:16px; left:16px; right:16px;
        display:flex; justify-content:space-between; align-items:flex-start;
        z-index:5;
    }

    #playerPageModal .modal-content .icon-btn{
        width:34px; height:34px; border-radius:50%;
        background:var(--panel);
        border:1px solid var(--line);
        backdrop-filter: blur(14px);
        -webkit-backdrop-filter: blur(14px);
        display:flex; align-items:center; justify-content:center;
        color:var(--text);
        cursor:pointer;
        flex-shrink:0;
    }

    #playerPageModal .modal-content .badge{
        padding:4px 10px;
        border-radius:8px;
        font-size:11px;
        font-weight:600;
        letter-spacing:0.02em;
        background:var(--panel);
        border:1px solid var(--line);
        backdrop-filter: blur(14px);
        -webkit-backdrop-filter: blur(14px);
        color:var(--text);
    }

    #playerPageModal .modal-content .top-right-col{
        display:flex; flex-direction:column; align-items:flex-end; gap:8px;
    }

    #playerPageModal .modal-content .status-tag{
        font-size:10px; color:var(--text-dim);
        background:var(--panel);
        border:1px solid var(--line);
        padding:4px 8px; border-radius:6px;
        backdrop-filter: blur(14px);
    }

    #playerPageModal .modal-content .age-badge{
        padding:6px 12px;
        border-radius:10px;
        font-size:13px;
        font-weight:700;
    }

    #playerPageModal .modal-content .tv-badge{
        position:absolute; top:60px; left:16px; z-index:5;
        padding:4px 10px;
        border-radius:7px;
        font-size:11px;
        font-weight:700;
        background:#e5e5e5;
        color:#0a0a0a;
        border:1px solid var(--line);
    }

    #playerPageModal .modal-content .logo-wrap{
        position:absolute; left:0; right:0; bottom:100px; z-index:5;
        text-align:center;
        padding:0 16px;
    }

    #playerPageModal .modal-content .kicker{
        font-family:'Space Grotesk', sans-serif;
        font-style:italic;
        font-size:20px;
        font-weight:700;
        color:#f2f2f2;
        text-shadow:0 2px 18px rgba(0,0,0,0.7);
    }

    /* ---------- CONTENT BELOW IMAGE ---------- */
    #playerPageModal .modal-content .content-top{
        padding:0 16px 2px;
        text-align:center;
        background:var(--bg);
        position:relative;
        z-index:1;
    }

    #playerPageModal .modal-content h1.title{
        font-family:'Space Grotesk', sans-serif;
        font-size:24px;
        line-height:1.2;
        font-weight:700;
        color:#e9e9e9;
        margin-bottom:6px;
    }

    #playerPageModal .modal-content .meta-line{
        font-size:13px;
        color:var(--text-dim);
        margin-bottom:12px;
    }

    #playerPageModal .modal-content .tag-row{
        display:flex; flex-wrap:wrap; gap:6px;
        justify-content:center;
        margin-bottom:8px;
    }

    #playerPageModal .modal-content .tag{
        font-size:11px;
        padding:6px 10px;
        border-radius:8px;
        border:1px solid var(--line);
        background:rgba(255,255,255,0.04);
        color:#d8d8d8;
        white-space:nowrap;
    }

    /* ---------- RATINGS + FORMAT ---------- */
    #playerPageModal .modal-content .ratings-row{
        display:flex; gap:8px; justify-content:center;
        margin:16px 16px 10px;
    }

    #playerPageModal .modal-content .rating-card{
        background:var(--panel);
        border:1px solid var(--line);
        border-radius:12px;
        padding:10px 18px;
        text-align:center;
        backdrop-filter: blur(14px);
        -webkit-backdrop-filter: blur(14px);
    }

    #playerPageModal .modal-content .rating-num{
        font-family:'Space Grotesk', sans-serif;
        font-size:18px;
        font-weight:700;
        color:#fff;
    }
    #playerPageModal .modal-content .rating-num .emoji{ font-size:16px; margin-right:3px; }

    #playerPageModal .modal-content .rating-label{
        font-size:9px;
        color:var(--text-dimmer);
        text-transform:uppercase;
        letter-spacing:0.06em;
        margin-top:2px;
    }

    #playerPageModal .modal-content .format-row{
        display:flex; gap:6px; justify-content:center; margin-bottom:16px; flex-wrap:wrap;
    }

    #playerPageModal .modal-content .format-pill{
        font-size:10px;
        font-weight:700;
        letter-spacing:0.05em;
        padding:6px 14px;
        border-radius:7px;
        border:1px solid var(--line);
        color:#c9c9c9;
        background:rgba(255,255,255,0.04);
        transition:all 0.2s;
    }
    #playerPageModal .modal-content .format-pill[data-dub]:hover{
        background:rgba(255,255,255,0.08);
        color:#fff;
    }
    #playerPageModal .modal-content .format-pill.active-format{
        background:var(--accent);
        color:#0a0a0a;
        border-color:var(--accent);
    }

    /* ---------- ACTIONS ---------- */
    #playerPageModal .modal-content .actions{
        display:flex; align-items:center;
        justify-content:center;
        gap:36px;
        padding:0 16px 6px;
    }

    #playerPageModal .modal-content .action-icon{
        display:flex; align-items:center; justify-content:center;
        color:#f2f2f2;
        transition:transform 0.2s;
    }
    #playerPageModal .modal-content .action-icon:hover{ transform:scale(1.1); }
    #playerPageModal .modal-content .action-icon.bookmarked{ color:#ffd700; }
    #playerPageModal .modal-content .action-icon.liked{ color:#7CFC9A; }

    /* posters (рекомендації / подібні) */

    /* ==================================================================

       відгуками). Той самий локальний дизайн-скоуп, що і в
       #playerPageModal, але фокус лише на джерелі/фільтрах/серіях.
       ================================================================== */
    #watchPageModal {
        display:none;
        position:fixed; inset:0;
        background:rgba(0,0,0,0.92);

        justify-content:center; align-items:flex-start;

    #watchPageModal .modal-content{

        --panel:rgba(255,255,255,0.06);
        --panel-strong:rgba(255,255,255,0.10);

        --text:#f2f2f2;
        --text-dim:#9a9a9a;

    }

        backdrop-filter:blur(20px); -webkit-backdrop-filter:blur(20px);
        color:var(--text); transition:background .2s ease;
    }
    .watch-pill:hover{ background:var(--panel-strong); }

    .ep-grid{ display:grid; grid-template-columns:1fr 1fr; gap:12px; padding:16px; }

    /* ---------- COMPACT VIEW ---------- */
    .ep-compact-list{ display:flex; flex-direction:column; gap:8px; padding:4px 16px 16px; }
    .epv2c-row{
        display:flex; align-items:center; gap:10px; cursor:pointer;

    /* ---------- CLASSIC VIEW ---------- */
    .ep-classic-list{ display:flex; flex-direction:column; gap:12px; padding:4px 16px 16px; }
    .epv2l-thumb{

    .epv2l-row:hover .epv2l-thumb{ filter:grayscale(0%) contrast(1); }
    .epv2l-thumb::after{ content:''; position:absolute; inset:0; background:linear-gradient(180deg, rgba(0,0,0,0) 45%, rgba(0,0,0,0.75) 100%); }
    .epv2l-badge{ position:absolute; z-index:2; top:10px; padding:4px 10px; border-radius:8px; font-size:11px; font-weight:700; background:rgba(10,10,10,.75); color:var(--text); backdrop-filter:blur(8px); }
    .epv2l-badge-num{ left:10px; }
    .epv2l-badge-quality{ right:10px; text-transform:uppercase; }
    .epv2l-title-overlay{ position:absolute; z-index:2; left:12px; right:12px; bottom:10px; font-size:15px; font-weight:700; color:#fff; }
    .epv2l-progress{ position:absolute; z-index:2; left:0; right:0; bottom:0; height:3px; background:rgba(255,255,255,0.25); }
    .epv2l-progress-fill{ height:100%; background:var(--text); }
    .epv2l-meta-row{ display:flex; align-items:center; gap:8px; font-size:12px; color:var(--text-dimmer); padding:6px 2px 0; }
